# ═══════════════════════════════════════════════════════════
#  Udemy「Java DBアクセス」の演習
#
#  講座リポジトリ learn_java_db_aidd の projects/master にある 32 プロジェクトを、
#  それぞれ単独で動く Gradle プロジェクトにして templates/ に置いている
#  （Spring は使わない。runtime はすべて java）
#
#  実行の入口は 2 種類
#    - テストが入口の小さな教材（jdbc-* / jpa-crud / jpa-relations / mybatis-crud / mybatis-dynamic）
#      → run: gradle:test。テストがプロジェクト専用のインメモリ DB を用意する
#    - main を持つ取り込み教材（jpa-basic-1 など 25 プロジェクト）→ run: gradle:run
#      元は HSQLDB サーバーの testdb を setupHsqldb で初期化してから -PmainClass で 1 つずつ動かしていた。
#      Codinable ではサーバーも引数も使えないので、接続先をインメモリ（jdbc:hsqldb:mem:testdb）にし、
#      起動クラス pro.kensait.course.SampleLauncher が mains.txt の main を順に、
#      main ごとに sql/hsqldb/*.sql で初期化し直してから動かす。
#      2 つのプロセスで行っていたロックの確認は mains.txt の「A & B」行（別スレッド・別セッション）で再現する
#
#  exercises[] の項目:
#    id           演習の識別子（dir 省略時はディレクトリ名として使う）
#    dir          templates/ 配下のディレクトリ名（省略時は id）
#                 複数のチャプターで同じプロジェクトを使うときは、別 id で同じ dir を指す
#    chapter      対応するチャプター番号。一覧のバッジに出る
#    lesson       対応するレッスン番号と名前（原稿の目次の見出し）。一覧の副題に出る
#    runtime      実行環境（java / spring / node / react / python / static / sql / shell）
#    run          ▶ アプリ実行で動かすもの（gradle:run）か、テストが主役か（gradle:test。テストクラスがツリーで目立つ）
#                 テストクラスは開いてエディタの右上の ▶ 実行で流す
#                 ファイル単位で動かす演習では最初に動かすファイル（sql: / file:。エディタの右上の ▶ 実行で動かす）
#    suggestName  作業用プロジェクト名の既定値
#    names        演習名（言語ごと）
#    descriptions 「何をどう動かすか」の説明（言語ごと）
#    openFiles    演習を開いた直後に開くファイル。演習の概要を書いた README.md 1 つ
# ═══════════════════════════════════════════════════════════
id: java-db-access
order: 9
# 同じ id の講座が複数の置き場にあるときは、この version が新しいほうが使われる
version: 1.3.0

names:
  ja: Java DBアクセス
  en: Java Database Access

descriptions:
  ja: >-
    JDBC から MyBatis、JPA（Hibernate）へと、データアクセス層の方式を段階的に比較する講座の演習です。
    接続・CRUD・トランザクション、楽観ロックと悲観ロック、関連のマッピング、JPQL・ネイティブSQL・動的検索、
    複合主キーや継承までを扱います。講座本編は HSQLDB サーバーを起動して main を 1 つずつ実行しますが、
    ここでは HSQLDB のインメモリ DB に切り替え、▶ アプリ実行（テストが入口の教材はテストクラスを開いてエディタの右上の ▶ 実行）を押すだけで初期化から実行までが済むようにしてあります。
    main やテストクラスを 1 つだけ動かすときは、そのファイルを開いてエディタの右上の ▶ 実行を押します。
  en: >-
    Exercises for the course that compares data access approaches step by step, from JDBC to MyBatis
    and JPA (Hibernate): connections, CRUD and transactions, optimistic and pessimistic locking,
    association mapping, JPQL / native SQL / dynamic queries, composite keys and inheritance.
    The course itself starts an HSQLDB server and runs each main one at a time; here the samples use an
    in-memory HSQLDB so pressing ▶ Run app (or, for the test-based exercises, opening the test class and pressing ▶ Run at the top right of the editor) initializes the data and runs everything.
    To run a single main or test class, open it and press ▶ Run at the top right of the editor.

udemy:
  url: https://github.com/KenyaSaitoh/learn_java_db_aidd

# チャプター名（演習一覧の見出し。講座原稿の目次と同じ名前にする）
chapters:
  3:
    ja: 'JDBCの接続・CRUD・トランザクション'
    en: 'JDBC Connections, CRUD and Transactions'
  4:
    ja: 'Table Data GatewayとMyBatisの基本'
    en: 'Table Data Gateway and MyBatis Basics'
  5:
    ja: 'Data MapperとJPAの基本'
    en: 'Data Mapper and JPA Basics'
  6:
    ja: '同時更新と楽観ロック・悲観ロック'
    en: 'Concurrent Updates with Optimistic and Pessimistic Locking'
  7:
    ja: '関連の読み込み方式とMyBatis'
    en: 'Loading Associations with MyBatis'
  8:
    ja: 'JPAの関連・フェッチ・カスケード'
    en: 'JPA Associations, Fetching and Cascading'
  9:
    ja: 'JPQLの検索・結合・集約'
    en: 'JPQL Queries, Joins and Aggregation'
  10:
    ja: 'JPAの一括更新とネイティブSQL'
    en: 'JPA Bulk Updates and Native SQL'
  11:
    ja: 'MyBatisとCriteria APIの動的検索'
    en: 'Dynamic Queries with MyBatis and the Criteria API'
  12:
    ja: 'JPAの値オブジェクト・複合主キー'
    en: 'JPA Value Objects and Composite Keys'
  13:
    ja: 'JPAの継承とライフサイクル設計'
    en: 'JPA Inheritance and Lifecycle Design'

exercises:
  # ── チャプター3: JDBC ─────────────────────────────
  - id: jdbc-connection
    chapter: 3
    lesson: '3.1 JDBCの接続・CRUD・トランザクション'
    runtime: java
    run: 'gradle:test'
    suggestName: jdbc-connection
    names:
      ja: JDBC URL と Connection の取得
      en: JDBC URLs and obtaining a Connection
    descriptions:
      ja: >-
        JdbcUrl で JDBC URL を 3 つの要素に分け、ConnectionFactory で DriverManager と DataSource の
        両方から接続を取ります。ConnectionFactoryTest.java を開いて、エディタの右上の ▶ 実行で流し、
        DB 製品名・autoCommit の初期値・不完全な URL の拒否を確かめるテストが通ることを見てください。
      en: >-
        JdbcUrl splits a JDBC URL into its three parts, and ConnectionFactory obtains connections from both
        DriverManager and DataSource. Open ConnectionFactoryTest.java, press ▶ Run at the top right of the editor and check the tests for the
        database product name, the initial autoCommit value and rejecting incomplete URLs.
    openFiles:
      - README.md

  - id: jdbc-crud
    chapter: 3
    lesson: '3.1 JDBCの接続・CRUD・トランザクション'
    runtime: java
    run: 'gradle:test'
    suggestName: jdbc-crud
    names:
      ja: PreparedStatement による CRUD と DAO
      en: CRUD and a DAO with PreparedStatement
    descriptions:
      ja: >-
        EmployeeDao が PreparedStatement で登録・検索・更新・削除を行い、ResultSet を Employee に詰め替えます。
        EmployeeDaoTest.java を開いてエディタの右上の ▶ 実行で流し、該当なし（Optional の空・更新件数 0）、重複キー、SQL 構文を含む名前が
        値として保存されることを確かめるテストの結果を見てください。
      en: >-
        EmployeeDao inserts, finds, updates and deletes with PreparedStatement and maps the ResultSet to
        Employee. Open EmployeeDaoTest.java, press ▶ Run at the top right of the editor and look at the tests for "not found" (empty Optional / 0 rows updated),
        duplicate keys, and names containing SQL syntax being stored as plain values.
    openFiles:
      - README.md

  - id: jdbc-transaction
    chapter: 3
    lesson: '3.1 JDBCの接続・CRUD・トランザクション'
    runtime: java
    run: 'gradle:test'
    suggestName: jdbc-transaction
    names:
      ja: commit・rollback・savepoint・一括更新
      en: commit, rollback, savepoints and batch updates
    descriptions:
      ja: >-
        PayrollService が autoCommit を切り、複数社員の昇給を addBatch でまとめて実行します。
        PayrollServiceTest.java を開いてエディタの右上の ▶ 実行で流し、途中で失敗すると先に済んだ更新も戻ること、savepoint で給与だけ取り消せること、
        CallableStatement の OUT 引数で部署の社員数を受け取れることをテスト結果で確かめてください。
      en: >-
        PayrollService turns autoCommit off and raises several salaries at once with addBatch.
        Open PayrollServiceTest.java, press ▶ Run at the top right of the editor and confirm in the results that a failure part-way also undoes earlier updates,
        that a savepoint can undo only the salary change, and that a CallableStatement OUT parameter
        returns the head count of a department.
    openFiles:
      - README.md

  # ── チャプター4: MyBatis の基本 ─────────────────────
  - id: mybatis-basic-1
    chapter: 4
    lesson: '4.1 Table Data GatewayとMyBatisの基本'
    runtime: java
    run: 'gradle:run'
    suggestName: mybatis-basic-1
    names:
      ja: SqlSession と Mapper による CRUD
      en: CRUD with SqlSession and Mapper interfaces
    descriptions:
      ja: >-
        ▶ アプリ実行で、SQL-ID で呼び出す main1 の SelectMain1〜7・InsertMain1・UpdateMain1〜3・DeleteMain1〜2 と、
        Mapper インターフェースで呼び出す main2 の各 main を順に実行します。出力の「==> Preparing」に出る SQL と
        パラメータ、「<== Total / Updates」の件数を mybatis-mapper.xml の定義と見比べてください。
        1 つだけ動かすときは mains.txt のほかの行を # で止めます。
      en: >-
        ▶ Run app executes, in order, the main1 examples that call statements by SQL ID (SelectMain1-7,
        InsertMain1, UpdateMain1-3, DeleteMain1-2) and the main2 examples that go through the Mapper interface.
        Compare the SQL and parameters on the "==> Preparing" lines and the counts on "<== Total / Updates"
        with mybatis-mapper.xml. To run just one, comment out the other lines of mains.txt with #.
    openFiles:
      - README.md

  - id: mybatis-basic-2
    chapter: 4
    lesson: '4.1 Table Data GatewayとMyBatisの基本'
    runtime: java
    run: 'gradle:run'
    suggestName: mybatis-basic-2
    names:
      ja: 型のマッピング・自動採番・集合パラメータ
      en: Type mapping, generated keys and collection parameters
    descriptions:
      ja: >-
        入社日（LocalDate）・職務（列挙型）・バージョンを持つ社員を扱います。▶ アプリ実行で SelectMain1・2、
        InsertMain1・2 を順に実行し、foreach で組み立てた IN 句と、INSERT 後に Employee へ戻ってきた
        採番結果が出力にどう表れるかを確かめてください。
      en: >-
        Employees now carry a hire date (LocalDate), a job (enum) and a version. ▶ Run app executes
        SelectMain1-2 and InsertMain1-2; check in the output the IN clause built with foreach and the
        generated key written back into Employee after the INSERT.
    openFiles:
      - README.md

  - id: mybatis-crud
    chapter: 4
    lesson: '4.1 Table Data GatewayとMyBatisの基本'
    runtime: java
    run: 'gradle:test'
    suggestName: mybatis-crud
    names:
      ja: Mapper の CRUD をテストで確かめる
      en: Check Mapper CRUD with tests
    descriptions:
      ja: >-
        EmployeeMapper（インターフェース）と EmployeeMapper.xml の SQL-ID を対応させた小さな教材です。
        EmployeeMapperTest.java を開いてエディタの右上の ▶ 実行で流し、登録・検索・更新・削除と commit の関係を確かめるテストの結果を見てください。
      en: >-
        A small sample that pairs the EmployeeMapper interface with the SQL IDs in EmployeeMapper.xml.
        Open EmployeeMapperTest.java, press ▶ Run at the top right of the editor and look at the tests covering insert, find, update, delete and commit.
    openFiles:
      - README.md

  # ── チャプター5: JPA の基本 ─────────────────────────
  - id: jpa-basic-1
    chapter: 5
    lesson: '5.1 Data MapperとJPAの基本'
    runtime: java
    run: 'gradle:run'
    suggestName: jpa-basic-1
    names:
      ja: EntityManager による CRUD と変更検知
      en: CRUD and change detection with EntityManager
    descriptions:
      ja: >-
        ▶ アプリ実行で SelectMain → InsertMain → UpdateMain → DeleteMain を順に実行します。
        Hibernate が出力する SQL を見て、find・persist・remove と、UpdateMain で setter を呼んだだけの変更が
        コミット時に UPDATE になることを確かめてください。
      en: >-
        ▶ Run app executes SelectMain, InsertMain, UpdateMain and DeleteMain in order.
        Read the SQL Hibernate prints and see how find, persist and remove map to SQL, and how a plain
        setter call in UpdateMain becomes an UPDATE at commit.
    openFiles:
      - README.md

  - id: jpa-basic-2
    chapter: 5
    lesson: '5.1 Data MapperとJPAの基本'
    runtime: java
    run: 'gradle:run'
    suggestName: jpa-basic-2
    names:
      ja: LocalDate・列挙型・LOB のマッピング
      en: Mapping LocalDate, enums and LOBs
    descriptions:
      ja: >-
        入社日・職務・写真を加えた Employee で、Java の型と列の対応を扱います。▶ アプリ実行で CRUD の 4 つの main を
        順に実行し、列挙型がどの値で保存され、日付がどう読み戻されるかを出力の SQL と取得結果で確かめてください。
      en: >-
        Employee gains a hire date, a job and a photo to show how Java types map to columns. ▶ Run app
        executes the four CRUD mains; use the printed SQL and results to see how the enum is stored and how
        the date is read back.
    openFiles:
      - README.md

  - id: jpa-crud
    chapter: 5
    lesson: '5.1 Data MapperとJPAの基本'
    runtime: java
    run: 'gradle:test'
    suggestName: jpa-crud
    names:
      ja: Repository とトランザクションの分担
      en: Repository and transaction responsibilities
    descriptions:
      ja: >-
        EmployeeRepository は EntityManager を引数で受け取り、トランザクションは呼び出し元が開始・確定します。
        EmployeeRepositoryTest.java を開いてエディタの右上の ▶ 実行で流し、テスト結果とテストコードでこの分担を確かめてください。
      en: >-
        EmployeeRepository receives the EntityManager as an argument and the caller begins and commits the
        transaction. Open EmployeeRepositoryTest.java, press ▶ Run at the top right of the editor and follow this split in the test results and the test code.
    openFiles:
      - README.md

  # ── チャプター6: 楽観ロック・悲観ロック ─────────────
  - id: mybatis-lock
    chapter: 6
    lesson: '6.1 同時更新と楽観ロック・悲観ロック'
    runtime: java
    run: 'gradle:run'
    suggestName: mybatis-lock
    names:
      ja: MyBatis の楽観ロックと FOR UPDATE
      en: Optimistic locking and FOR UPDATE with MyBatis
    descriptions:
      ja: >-
        ▶ アプリ実行で OptimisticLockMain1 と 2、PessimisticLockMain1 と 2 を、それぞれ 3 秒ずらして同時に動かします
        （元は 2 つのプロセスを別々に起動して行う確認）。楽観ロックでは後から UPDATE した 2 が「Updates: 0」で例外になり、
        悲観ロックでは 2 の SELECT ... FOR UPDATE が 1 のコミットまで待たされることを、出力の経過秒と SQL で
        確かめてください。古いバージョンでの更新が 0 件になることは、OptimisticLockTest.java を開いてエディタの右上の ▶ 実行で流すと確かめられます。
      en: >-
        ▶ Run app starts OptimisticLockMain1 and 2, then PessimisticLockMain1 and 2, each pair 3 seconds apart
        in the same run (the course starts them as two separate processes). With optimistic locking, main 2 updates
        "Updates: 0" and throws; with pessimistic locking, main 2's SELECT ... FOR UPDATE waits until main 1
        commits - follow the elapsed seconds and SQL in the output. Open OptimisticLockTest.java and press ▶ Run at the top right
        of the editor to check that an update with a stale version affects 0 rows.
    openFiles:
      - README.md

  - id: jpa-lock
    chapter: 6
    lesson: '6.1 同時更新と楽観ロック・悲観ロック'
    runtime: java
    run: 'gradle:run'
    suggestName: jpa-lock
    names:
      ja: JPA の @Version と悲観ロック
      en: '@Version and pessimistic locks in JPA'
    descriptions:
      ja: >-
        ▶ アプリ実行で LockMain と LockConflictor、ReadLock・WriteLock・WriteLockForce の各組を 3 秒ずらして
        同時に動かします（4 組で 1 分半ほど）。LockMain が OptimisticLockException で終わること、悲観ロックの
        競合側が先の側のコミット後に終わることを、出力の経過秒と SQL で確かめてください。
        OptimisticLockTest.java を開いてエディタの右上の ▶ 実行で流すと、古いバージョンでの更新の拒否を確かめられます。
      en: >-
        ▶ Run app starts LockMain with LockConflictor and the ReadLock, WriteLock and WriteLockForce pairs,
        each pair 3 seconds apart (about 90 seconds for all four). Use the elapsed seconds and SQL in the output
        to see LockMain end with OptimisticLockException and each pessimistic conflicter finish only after the
        first one commits. Open OptimisticLockTest.java and press ▶ Run at the top right of the editor to check that a stale version is rejected.
    openFiles:
      - README.md

  # ── チャプター7: 関連の読み込み（MyBatis）──────────
  - id: mybatis-relation
    chapter: 7
    lesson: '7.1 関連の読み込み方式とMyBatis'
    runtime: java
    run: 'gradle:run'
    suggestName: mybatis-relation
    names:
      ja: flat・join・nest による関連の取得
      en: Loading associations as flat, join and nested selects
    descriptions:
      ja: >-
        ▶ アプリ実行で FlatSelectMain1・2、JoinSelectMain1・2、NestSelectMain1・2、InsertMain、UpdateMain を
        順に実行します。同じ社員と部署を取るのに、JOIN 1 本で取る方式と入れ子の SELECT で追加取得する方式とで、
        出力に出る SQL の本数がどう変わるかを見比べてください。
      en: >-
        ▶ Run app executes FlatSelectMain1-2, JoinSelectMain1-2, NestSelectMain1-2, InsertMain and UpdateMain.
        Compare how many SQL statements appear in the output when the same employees and departments are loaded
        with one JOIN versus nested selects.
    openFiles:
      - README.md

  - id: mybatis-dynamic-summary
    dir: mybatis-dynamic
    chapter: 7
    lesson: '7.1 関連の読み込み方式とMyBatis'
    runtime: java
    run: 'gradle:test'
    suggestName: mybatis-dynamic-summary
    names:
      ja: 部署別の集約を DTO で受け取る
      en: Receiving per-department aggregates as DTOs
    descriptions:
      ja: >-
        CompanyMapper.xml の summarizeDepartments は、関連をたどるオブジェクトではなく、業務に必要な集約値だけを
        DepartmentSummary で返します。CompanyMapperTest.java を開いてエディタの右上の ▶ 実行で流し、集約のテスト結果を確かめてください。
        （同じプロジェクトはチャプター 11 の動的 SQL でも使います）
      en: >-
        summarizeDepartments in CompanyMapper.xml returns only the aggregate values needed, as DepartmentSummary,
        instead of an object graph. Open CompanyMapperTest.java, press ▶ Run at the top right of the editor and check the aggregation test.
        (The same project is used again for dynamic SQL in chapter 11.)
    openFiles:
      - README.md

  # ── チャプター8: JPA の関連 ─────────────────────────
  - id: jpa-relation-1
    chapter: 8
    lesson: '8.1 JPAの関連・フェッチ・カスケード'
    runtime: java
    run: 'gradle:run'
    suggestName: jpa-relation-1
    names:
      ja: 1対多・多対1、fetch と cascade
      en: One-to-many / many-to-one, fetch and cascade
    descriptions:
      ja: >-
        ▶ アプリ実行で SelectMain1・2、InsertMain、MapkeyMain、FetchStrategyMain、CascadeStrategyMain、DeleteMain を
        順に実行し、最後に CascadeOptimisticLockMain1 と 2 を 3 秒ずらして同時に動かします。
        EAGER と LAZY で SELECT が出るタイミング、CascadeType.ALL による削除の波及を、出力の SQL で確かめてください。
        最後の組では、部署の merge でカスケードされた社員の更新が OptimisticLockException になります。
      en: >-
        ▶ Run app executes SelectMain1-2, InsertMain, MapkeyMain, FetchStrategyMain, CascadeStrategyMain and
        DeleteMain, then runs CascadeOptimisticLockMain1 and 2 together, 3 seconds apart. Use the printed SQL to
        see when SELECTs are issued for EAGER vs LAZY and how CascadeType.ALL spreads a delete.
        In the last pair, the employee update cascaded from merging the department ends with OptimisticLockException.
    openFiles:
      - README.md

  - id: jpa-relations
    chapter: 8
    lesson: '8.1 JPAの関連・フェッチ・カスケード'
    runtime: java
    run: 'gradle:test'
    suggestName: jpa-relations
    names:
      ja: 双方向の整合と fetch join
      en: Keeping both sides in sync and fetch join
    descriptions:
      ja: >-
        Department#addEmployee が両方向の参照をそろえ、CompanyQuery が fetch join で部署と社員をまとめて取ります。
        CompanyQueryTest.java を開いてエディタの右上の ▶ 実行で流し、結果と出力される SQL を確かめてください。
      en: >-
        Department#addEmployee keeps both directions in sync and CompanyQuery loads departments with their
        employees via fetch join. Open CompanyQueryTest.java, press ▶ Run at the top right of the editor and check the results and the SQL it prints.
    openFiles:
      - README.md

  - id: jpa-relation-2
    chapter: 8
    lesson: '8.1 JPAの関連・フェッチ・カスケード'
    runtime: java
    run: 'gradle:run'
    suggestName: jpa-relation-2
    names:
      ja: 1対1・多対多と結合表
      en: One-to-one, many-to-many and join tables
    descriptions:
      ja: >-
        社員に住所・電話・メール・役職・担当プロジェクト・資格を関連付けたモデルです。▶ アプリ実行で SelectMain と
        InsertMain を実行し、外部キーや結合表に対して出る SQL を、エンティティのアノテーションと見比べてください。
      en: >-
        Employees are linked to an address, phones, emails, a job, projects and qualifications. ▶ Run app executes
        SelectMain and InsertMain; compare the SQL issued against foreign keys and join tables with the entity
        annotations.
    openFiles:
