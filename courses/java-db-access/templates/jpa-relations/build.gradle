// ═══════════════════════════════════════════════════════════
//  jpa-relations
//  講座リポジトリ learn_java_db_aidd の projects/master/06_jpa-relations/jpa-relations を、
//  単独で動く Gradle プロジェクトにしたもの
//  （元は親の build.gradle と共通スクリプトで設定を共有するマルチプロジェクト）
// ═══════════════════════════════════════════════════════════
//
//  このプロジェクトの入口はテスト（main は持たない）。実行対象で「test」を選んで実行する
//  テストはプロジェクト専用のインメモリ DB を自分で用意するので、DB サーバーは要らない

plugins {
    id 'java'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

repositories {
    mavenCentral()
}

dependencies {
    implementation 'jakarta.persistence:jakarta.persistence-api:3.2.0'
    // 親では Spring Boot 4.1.0 の依存管理で解決していた版（7.4.1.Final）を直書きする
    implementation 'org.hibernate.orm:hibernate-core:7.4.1.Final'
    runtimeOnly 'org.hsqldb:hsqldb:2.7.4'
}

// JUnit は親の設定と同じ 6.0.3（Jupiter と Platform Launcher をまとめて入れる）
testing { suites { test { useJUnitJupiter('6.0.3') } } }

test {
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}
