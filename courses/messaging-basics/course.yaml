id: messaging-basics
order: 20
version: 1.0.0
names:
  ja: Kafka・RabbitMQ サンプル
  en: Kafka and RabbitMQ Samples
descriptions:
  ja: 同梱サーバーを使って、Java からメッセージを送受信するサンプルです。
  en: Send and receive messages from Java using the bundled servers.
exercises:
  - id: kafka-roundtrip
    runtime: java
    run: gradle:run
    names:
      ja: Kafka — トピックへの送信と受信
      en: Kafka — produce and consume
    descriptions:
      ja: 実行すると Kafka が起動し、トピックを作成してメッセージを送受信します。
      en: Run to start Kafka, create a topic, and send and receive a message.
    openFiles: [src/main/java/KafkaExample.java, README.md]
  - id: rabbitmq-roundtrip
    runtime: java
    run: gradle:run
    names:
      ja: RabbitMQ — キューへの送信と受信
      en: RabbitMQ — publish and consume
    descriptions:
      ja: 実行すると RabbitMQ が起動し、キューにメッセージを送信して受信確認を返します。
      en: Run to start RabbitMQ, publish to a queue, and acknowledge the received message.
    openFiles: [src/main/java/RabbitExample.java, README.md]
