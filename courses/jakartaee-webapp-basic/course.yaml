# ═══════════════════════════════════════════════════════════
#  Udemy「Jakarta EE Webアプリ基礎」の演習
#
#  講義そのものは動画側にあり、ここには講座原稿（01_master）のコードを
#  Codinable 単独で動く形にしたものを置く。問題を出して解かせることはしない
#
#  雛形は war プラグインの Gradle プロジェクトで、▶ アプリ実行（gradle:payaraRun）が
#  WAR を作って同梱の Payara Server 7 へデプロイする（desktop/src/main/payara.js）
#  WAR のファイル名がコンテキストルートになるので、preview はコンテキストルートから書く
#
#  exercises[] の項目は spring-boot-webapp-basic/course.yaml と同じ
#  （runtime は jakarta、run は gradle:payaraRun）
#  同じアプリケーションを複数のチャプターで使うときは dir で同じ雛形を指す
#  （jakarta-faces-calc-3-config-exception はチャプター4 と 6 の両方に出す。講座原稿 1.2 の演習の表に合わせて、
#    どちらも作業用プロジェクト名の既定値は jakarta-faces-calc-3-config-exception にしている）
#  DB を使う演習（チャプター9〜13）は @DataSourceDefinition でインメモリの HSQLDB を定義し、
#  起動時に sql/hsqldb のテーブル定義と初期データを流す（デプロイのたびに初期データへ戻る）
#  チャプター14 の 2 つの演習は、呼び出し先の確認用 API（employee-api.war）を同梱する
# ═══════════════════════════════════════════════════════════
id: jakartaee-webapp-basic
order: 11
# 同じ id の講座が複数の置き場にあるときは、この version が新しいほうが使われる
version: 1.0.0

names:
  ja: Jakarta EE Webアプリ基礎
  en: 'Jakarta EE Web Apps: Fundamentals'

descriptions:
  ja: >-
    Jakarta EE 11 の Web アプリケーションを、サーブレットと JSP、CDI とレイヤー設計、
    Jakarta Faces の画面生成・入力検証・画面遷移、ファイルの送受信、JDBC と Jakarta Persistence・
    Jakarta Data、Jakarta Transactions、Jakarta REST とクライアント API の順に動かして確かめる講座の演習です。
    WAR は同梱の Payara Server 7 へデプロイして動かします。
  en: >-
    Exercises for the course that runs a Jakarta EE 11 web application step by step:
    servlets and JSP, CDI and layering, page rendering, validation and navigation with Jakarta Faces,
    file upload and download, JDBC, Jakarta Persistence and Jakarta Data, Jakarta Transactions,
    and Jakarta REST with the client API. WARs are deployed to the bundled Payara Server 7.

# チャプター名（演習一覧の見出し。講座原稿の目次と同じ名前にする）
chapters:
  2:
    ja: 'Jakarta EEとサーブレットによるHTTP処理'
    en: 'HTTP Processing with Jakarta EE and Servlets'
  3:
    ja: 'JSPとMVCパターンによる画面生成'
    en: 'Rendering Pages with JSP and the MVC Pattern'
  4:
    ja: 'CDIによるDIとレイヤー設計'
    en: 'DI and Layered Design with CDI'
  5:
    ja: 'Jakarta Facesによる画面生成'
    en: 'Rendering Pages with Jakarta Faces'
  6:
    ja: 'Jakarta Facesの入力検証・変換・例外処理'
    en: 'Validation, Conversion and Exception Handling in Jakarta Faces'
  7:
    ja: '画面遷移とスコープによる状態管理'
    en: 'Navigation and State Management with Scopes'
  8:
    ja: 'ファイルのアップロードとダウンロード'
    en: 'File Upload and Download'
  9:
    ja: 'DataSourceとJDBCによるデータベースアクセス'
    en: 'Database Access with DataSource and JDBC'
  10:
    ja: 'Jakarta Persistenceと永続化コンテキスト'
    en: 'Jakarta Persistence and the Persistence Context'
  11:
    ja: 'Criteria APIとJakarta Dataによる検索'
    en: 'Queries with the Criteria API and Jakarta Data'
  12:
    ja: 'Jakarta Transactionsによるトランザクション管理と伝播'
    en: 'Transaction Management and Propagation with Jakarta Transactions'
  13:
    ja: 'Jakarta RESTによるREST API'
    en: 'REST APIs with Jakarta REST'
  14:
    ja: 'クライアントAPIによる同期HTTP通信'
    en: 'Synchronous HTTP Communication with the Client API'

exercises:
  # ── チャプター2: Jakarta EE とサーブレット ────────────────────
  - id: jakarta-servlet-hello
    chapter: 2
    lesson: '2.1 Jakarta EEとサーブレットによるHTTP処理'
    runtime: jakarta
    run: 'gradle:payaraRun'
    preview: '/jakarta-servlet-hello/hello'
    suggestName: jakarta-servlet-hello
    names:
      ja: 'サーブレットのライフサイクルを見る'
      en: 'See the servlet lifecycle'
    descriptions:
      ja: >-
        /hello に対応付けた HelloServlet を Payara Server 7 へデプロイします。
        ▶ アプリ実行で WAR を作ってデプロイすると、プレビューに
        http://localhost:8080/jakarta-servlet-hello/hello が開きます。
        実行結果で、デプロイの時点で HelloServlet#init が出ていることと、WAR のファイル名がコンテキストルートになっていることを確かめてください。
      en: >-
        Deploys HelloServlet, mapped to /hello, to Payara Server 7.
        ▶ Run app builds the WAR and deploys it, then the preview opens
        http://localhost:8080/jakarta-servlet-hello/hello.
        In the run output, check that HelloServlet#init appears at deployment and that the WAR file name became the context root.
    openFiles:
      - README.md

  - id: jakarta-servlet-calc
    chapter: 2
    lesson: '2.1 Jakarta EEとサーブレットによるHTTP処理'
    runtime: jakarta
    run: 'gradle:payaraRun'
    preview: '/jakarta-servlet-calc/'
    suggestName: jakarta-servlet-calc
    names:
      ja: 'HttpServletRequest と HttpServletResponse'
      en: 'HttpServletRequest and HttpServletResponse'
    descriptions:
      ja: >-
        CalcServlet が /add（POST）と /addByGet（GET）を受け、getParameter で受け取った値を足して HTML を書き出します。
        ▶ アプリ実行で http://localhost:8080/jakarta-servlet-calc/ の入力画面が開きます。
        curl/ のスクリプトをエディタの右上の ▶ 実行で流すと、パラメータが欠けたときの 400 と、数値でないときの 500 が確かめられます。
      en: >-
        CalcServlet handles /add (POST) and /addByGet (GET), adds the values read with getParameter and writes the HTML.
        ▶ Run app opens the input page at http://localhost:8080/jakarta-servlet-calc/.
        Run the scripts in curl/ with ▶ Run at the top right of the editor to see the 400 for a missing parameter and the 500 for a non-number.
    openFiles:
      - README.md

  # ── チャプター3: JSP と MVC ────────────────────
  - id: jakarta-jsp-calc
    chapter: 3
    lesson: '3.1 JSPとMVCパターンによる画面生成'
    runtime: jakarta
    run: 'gradle:payaraRun'
    preview: '/jakarta-jsp-calc/calc'
    suggestName: jakarta-jsp-calc
    names:
      ja: 'JSP へのフォワードとセッションのスコープ'
      en: 'Forwarding to JSP and the session scope'
    descriptions:
      ja: >-
        CalcServlet が計算結果をリクエストとセッションの属性に置き、WEB-INF/views の JSP へフォワードします。
        ▶ アプリ実行で http://localhost:8080/jakarta-jsp-calc/calc が開きます。計算してから入力画面へ戻ると、前回の計算結果が出ます。
        curl/ のスクリプトで、Cookie の有無による違いと、WEB-INF の JSP を直接開けないことを確かめてください。
      en: >-
        CalcServlet puts the result in request and session attributes and forwards to a JSP under WEB-INF/views.
        ▶ Run app opens http://localhost:8080/jakarta-jsp-calc/calc. After a calculation, going back to the input page shows the previous result.
        Use the scripts in curl/ to compare requests with and without the cookie, and to see that a JSP under WEB-INF cannot be opened directly.
    openFiles:
      - README.md

  - id: jakarta-jsp-employee
    chapter: 3
    lesson: '3.1 JSPとMVCパターンによる画面生成'
    runtime: jakarta
    run: 'gradle:payaraRun'
    preview: '/jakarta-jsp-employee/employees'
    suggestName: jakarta-jsp-employee
    names:
      ja: 'サーブレットと JSP の MVC とフィルタ'
      en: 'MVC with servlets and JSP, and a filter'
    descriptions:
      ja: >-
        社員一覧をサーブレット（Controller）・JSP（View）・業務処理のクラス（Model）に分け、AccessLogFilter が全リクエストを包みます。
        ▶ アプリ実行で http://localhost:8080/jakarta-jsp-employee/employees が開きます。削除すると 303 で一覧へリダイレクトします（PRG）。
        実行結果に、リクエストごとのアクセスログが出ます。
      en: >-
        The employee list is split into a servlet (Controller), a JSP (View) and business classes (Model), and AccessLogFilter wraps every request.
        ▶ Run app opens http://localhost:8080/jakarta-jsp-employee/employees. Deleting redirects to the list with 303 (PRG).
        The run output shows an access log line for each request.
    openFiles:
      - README.md

  # ── チャプター4: CDI とレイヤー設計 ────────────────────
  - id: jakarta-faces-calc-3-config-exception-cdi
    dir: jakarta-faces-calc-3-config-exception
    chapter: 4
    lesson: '4.1 CDIによるDIとレイヤー設計'
    runtime: jakarta
    run: 'gradle:payaraRun'
    preview: '/jakarta-faces-calc-3-config-exception/CalcInputPage.xhtml'
    suggestName: jakarta-faces-calc-3-config-exception
    names:
      ja: 'CDI の注入・プロデューサー・インターセプタ'
      en: 'CDI injection, producers and interceptors'
    descriptions:
      ja: >-
        計算アプリケーションの CalcBean は CalcService と Logger を @Inject で受け取り、CalcService には @Logged のインターセプタが働きます。
        ▶ アプリ実行で http://localhost:8080/jakarta-faces-calc-3-config-exception/CalcInputPage.xhtml が開きます。
        計算のたびに、実行結果に LoggingInterceptor の start・end のログが出ることを確かめてください（チャプター6.1でも同じアプリケーションを使います）。
      en: >-
        CalcBean in the calculator receives CalcService and a Logger through @Inject, and the @Logged interceptor applies to CalcService.
        ▶ Run app opens http://localhost:8080/jakarta-faces-calc-3-config-exception/CalcInputPage.xhtml.
        Check that each calculation prints the start and end log lines of LoggingInterceptor (the same application is used again in chapter 6.1).
    openFiles:
      - README.md

  - id: jakarta-faces-employee
    chapter: 4
    lesson: '4.1 CDIによるDIとレイヤー設計'
    runtime: jakarta
    run: 'gradle:payaraRun'
    preview: '/jakarta-faces-employee/EmployeeTablePage.xhtml'
    suggestName: jakarta-faces-employee
    names:
      ja: 'CDI によるレイヤー設計（メモリー版の社員管理）'
      en: 'Layered design with CDI (in-memory employee app)'
    descriptions:
      ja: >-
        EmployeeTableBean → EmployeeService → EmployeeDAO が @Inject で接続された社員管理です。保存先は EmployeeDAO の中の Map です。
        ▶ アプリ実行で http://localhost:8080/jakarta-faces-employee/EmployeeTablePage.xhtml を開き、一覧・登録・編集・削除を操作してください。
        登録と編集は会話スコープの EmployeeEditBean が入力・確認・確定の値を保持します。EmployeeServiceTest.java を開いてエディタの右上の ▶ 実行で流すと、コンテナなしのテストが走ります。
      en: >-
        An employee app where EmployeeTableBean -> EmployeeService -> EmployeeDAO are wired with @Inject. Data lives in a Map inside EmployeeDAO.
        ▶ Run app, open http://localhost:8080/jakarta-faces-employee/EmployeeTablePage.xhtml and list, create, edit and delete employees.
        The conversation-scoped EmployeeEditBean keeps the values through input, confirm and commit. Open EmployeeServiceTest.java and press ▶ Run at the top right of the editor to run the tests without a container.
    openFiles:
      - README.md

  # ── チャプター5: Jakarta Faces の画面生成 ────────────────────
  - id: jakarta-faces-hello
    chapter: 5
    lesson: '5.1 Jakarta Facesによる画面生成'
    runtime: jakarta
    run: 'gradle:payaraRun'
    preview: '/jakarta-faces-hello/HelloPage.xhtml'
    suggestName: jakarta-faces-hello
    names:
      ja: 'FacesServlet とバッキングBean'
      en: 'FacesServlet and a backing bean'
    descriptions:
      ja: >-
        web.xml で *.xhtml を FacesServlet に対応付け、HelloPage.xhtml の #{helloBean.message} がバッキングBean の値を表示します。
        ▶ アプリ実行で http://localhost:8080/jakarta-faces-hello/HelloPage.xhtml が開き、「Hello, Alice!」が表示されます。
      en: >-
        web.xml maps *.xhtml to FacesServlet, and #{helloBean.message} in HelloPage.xhtml shows the value of the backing bean.
        ▶ Run app opens http://localhost:8080/jakarta-faces-hello/HelloPage.xhtml and shows "Hello, Alice!".
    openFiles:
      - README.md

  - id: jakarta-faces-facelets-1
    chapter: 5
    lesson: '5.1 Jakarta Facesによる画面生成'
    runtime: jakarta
    run: 'gradle:payaraRun'
    preview: '/jakarta-faces-facelets-1/IndexPage.xhtml'
    suggestName: jakarta-faces-facelets-1
    names:
      ja: 'Facelets の式とデータ表示'
      en: 'Expressions and data display in Facelets'
    descriptions:
      ja: >-
        値式とエスケープ、ui:repeat による繰り返し、rendered による条件、h:link と f:param、f:convertNumber・f:convertDateTime を確かめます。
        ▶ アプリ実行で http://localhost:8080/jakarta-faces-facelets-1/IndexPage.xhtml の目次が開きます。各画面を開いて、出力された HTML を確かめてください。
      en: >-
        Try value expressions and escaping, iteration with ui:repeat, conditions with rendered, h:link with f:param, and f:convertNumber and f:convertDateTime.
        ▶ Run app opens the index at http://localhost:8080/jakarta-faces-facelets-1/IndexPage.xhtml. Open each page and look at the generated HTML.
    openFiles:
      - README.md

  - id: jakarta-faces-facelets-2
    chapter: 5
    lesson: '5.1 Jakarta Facesによる画面生成'
    runtime: jakarta
    run: 'gradle:payaraRun'
    preview: '/jakarta-faces-facelets-2/IndexPage.xhtml'
    suggestName: jakarta-faces-facelets-2
    names:
      ja: 'フォーム部品・テンプレート・メッセージバンドル'
      en: 'Form components, templates and message bundles'
    descriptions:
      ja: >-
        選択肢を持つ入力部品、ui:composition と ui:insert によるテンプレート、リソースの CSS・JavaScript、メッセージバンドルとロケールの切り替えを確かめます。
        ▶ アプリ実行で http://localhost:8080/jakarta-faces-facelets-2/IndexPage.xhtml の目次が開きます。
      en: >-
        Try input components with choices, templates with ui:composition and ui:insert, CSS and JavaScript resources, and message bundles with locale switching.
        ▶ Run app opens the index at http://localhost:8080/jakarta-faces-facelets-2/IndexPage.xhtml.
    openFiles:
      - README.md

  - id: jakarta-faces-calc-1-request
    chapter: 5
    lesson: '5.1 Jakarta Facesによる画面生成'
    runtime: jakarta
    run: 'gradle:payaraRun'
    preview: '/jakarta-faces-calc-1-request/CalcInputPage.xhtml'
    suggestName: jakarta-faces-calc-1-request
    names:
      ja: 'フォームとビューパラメータ（計算 1）'
      en: 'Forms and view parameters (calculator 1)'
    descriptions:
      ja: >-
        h:inputText の値が CalcBean の Double のプロパティに設定され、h:commandButton の add が計算します。CalcAddByGetPage.xhtml は f:viewParam で GET のクエリを受け取ります。
        ▶ アプリ実行で http://localhost:8080/jakarta-faces-calc-1-request/CalcInputPage.xhtml が開きます。curl/ のスクリプトでポストバックとビューパラメータを確かめてください（チャプター6.1でも使います）。
      en: >-
        Values of h:inputText are set to the Double properties of CalcBean, and add on h:commandButton calculates. CalcAddByGetPage.xhtml receives the GET query with f:viewParam.
        ▶ Run app opens http://localhost:8080/jakarta-faces-calc-1-request/CalcInputPage.xhtml. Use the scripts in curl/ to see the postback and the view parameters (also used in chapter 6.1).
    openFiles:
      - README.md

  # ── チャプター6: 入力検証・変換・例外処理 ────────────────────
  - id: jakarta-faces-calc-2-validation
    chapter: 6
    lesson: '6.1 Jakarta Facesの入力検証・変換・例外処理'
    runtime: jakarta
    run: 'gradle:payaraRun'
    preview: '/jakarta-faces-calc-2-validation/CalcInputPage.xhtml'
    suggestName: jakarta-faces-calc-2-validation
    names:
      ja: 'コンバーターと Bean Validation（計算 2）'
      en: 'Converters and Bean Validation (calculator 2)'
    descriptions:
      ja: >-
        CalcBean の BigDecimal のプロパティに @NotNull・@Min・@Max を付け、エラーを h:message で項目ごとに再表示します。
        ▶ アプリ実行で http://localhost:8080/jakarta-faces-calc-2-validation/CalcInputPage.xhtml を開き、空欄・abc・1001・-1000 と 1000・30 と 10 を送ってください。
        curl/01_inputs.sh をエディタの右上の ▶ 実行で流すと、同じ入力をまとめて確かめられます。
      en: >-
        @NotNull, @Min and @Max are put on the BigDecimal properties of CalcBean, and h:message shows the errors again per field.
        ▶ Run app, open http://localhost:8080/jakarta-faces-calc-2-validation/CalcInputPage.xhtml and submit blank, abc, 1001, -1000 and 1000, and 30 and 10.
        Run curl/01_inputs.sh with ▶ Run at the top right of the editor to try the same inputs at once.
    openFiles:
      - README.md

  - id: jakarta-faces-calc-3-config-exception
    chapter: 6
    lesson: '6.1 Jakarta Facesの入力検証・変換・例外処理'
    runtime: jakarta
    run: 'gradle:payaraRun'
    preview: '/jakarta-faces-calc-3-config-exception/CalcInputPage.xhtml'
    suggestName: jakarta-faces-calc-3-config-exception
    names:
      ja: '業務検証・設定値・業務例外（計算 3）'
      en: 'Business checks, configuration and business exceptions (calculator 3)'
    descriptions:
      ja: >-
        足し算のゼロと引き算の同値を FacesMessage で知らせ、桁数と上限を MicroProfile Config から注入し、上限超過とゼロ除算の業務例外を CalcErrorPage へ変換します。
        ▶ アプリ実行で http://localhost:8080/jakarta-faces-calc-3-config-exception/CalcInputPage.xhtml が開きます。
        curl/ のスクリプトで、業務検証・業務例外と、ViewExpiredException の ViewExpiredPage への変換を確かめてください。
      en: >-
        A zero in addition and equal values in subtraction are reported with FacesMessage, the scale and the limit are injected from MicroProfile Config, and the limit-over and divide-by-zero business exceptions turn into CalcErrorPage.
        ▶ Run app opens http://localhost:8080/jakarta-faces-calc-3-config-exception/CalcInputPage.xhtml.
        Use the scripts in curl/ to see the business checks and exceptions, and ViewExpiredException turned into ViewExpiredPage.
    openFiles:
      - README.md

  # ── チャプター7: 画面遷移とスコープ ────────────────────
  - id: jakarta-faces-calc-4-prg
    chapter: 7
    lesson: '7.1 画面遷移とスコープによる状態管理'
    runtime: jakarta
    run: 'gradle:payaraRun'
    preview: '/jakarta-faces-calc-4-prg/CalcInputPage.xhtml'
    suggestName: jakarta-faces-calc-4-prg
    names:
      ja: 'faces-redirect=true による PRG と Flash（計算 4）'
      en: 'PRG with faces-redirect=true and Flash (calculator 4)'
    descriptions:
      ja: >-
        計算結果を Flash に入れて CalcOutputPage へリダイレクトします。
        ▶ アプリ実行で http://localhost:8080/jakarta-faces-calc-4-prg/CalcInputPage.xhtml を開き、計算した後に結果画面を再読み込みしてください。
        POST は再送されず、Flash の値は 1 回の表示で消えます。curl/01_prg.sh で 302 と 2 回の GET を確かめられます。
      en: >-
        The result is put into Flash and the app redirects to CalcOutputPage.
        ▶ Run app, open http://localhost:8080/jakarta-faces-calc-4-prg/CalcInputPage.xhtml, calculate, and reload the result page.
        The POST is not sent again and the Flash value is gone after one display. curl/01_prg.sh shows the 302 and the two GETs.
    openFiles:
      - README.md

  - id: jakarta-faces-calc-5-conversation
    chapter: 7
    lesson: '7.1 画面遷移とスコープによる状態管理'
    runtime: jakarta
    run: 'gradle:payaraRun'
    preview: '/jakarta-faces-calc-5-conversation/CalcInputPage.xhtml'
    suggestName: jakarta-faces-calc-5-conversation
    names:
      ja: '会話スコープによる複数画面の状態（計算 5）'
      en: 'State across pages with the conversation scope (calculator 5)'
    descriptions:
      ja: >-
        計算結果を @ConversationScoped の CalcConversation に保持し、次の画面で税込金額を求めて会話を終了します。
        ▶ アプリ実行で http://localhost:8080/jakarta-faces-calc-5-conversation/CalcInputPage.xhtml を開き、足し算 → 税込計算と進めて、アドレスの cid を見てください。
        curl/01_conversation.sh で、終了した会話の cid が使えなくなることも確かめられます。
      en: >-
        The result is kept in the @ConversationScoped CalcConversation, the next page calculates the amount with tax, and the conversation ends.
        ▶ Run app, open http://localhost:8080/jakarta-faces-calc-5-conversation/CalcInputPage.xhtml, go from addition to the tax calculation, and watch cid in the address.
        curl/01_conversation.sh also shows that the cid of an ended conversation can no longer be used.
    openFiles:
      - README.md

  - id: jakarta-faces-calc-6-history
    chapter: 7
    lesson: '7.1 画面遷移とスコープによる状態管理'
    runtime: jakarta
    run: 'gradle:payaraRun'
    preview: '/jakarta-faces-calc-6-history/CalcInputPage.xhtml'
    suggestName: jakarta-faces-calc-6-history
    names:
      ja: 'ビューパラメータによる保存済みデータの再取得（計算 6）'
      en: 'Reloading stored data with view parameters (calculator 6)'
    descriptions:
      ja: >-
        計算のたびに履歴を保存し、結果画面へは履歴の ID だけを付けてリダイレクトします。結果画面は f:viewParam と f:viewAction で履歴を取り直します。
        ▶ アプリ実行で http://localhost:8080/jakarta-faces-calc-6-history/CalcInputPage.xhtml を開き、計算後に結果画面を再読み込みしたり、計算履歴から開いたりしてください。
      en: >-
        Each calculation is saved as history, and the app redirects to the result page with only the history ID. The result page reloads the history with f:viewParam and f:viewAction.
        ▶ Run app, open http://localhost:8080/jakarta-faces-calc-6-history/CalcInputPage.xhtml, reload the result page after a calculation, and open past results from the history.
    openFiles:
      - README.md

  # ── チャプター8: ファイルのアップロードとダウンロード ────────────────────
  - id: jakarta-servlet-file-upload
    chapter: 8
    lesson: '8.1 ファイルのアップロードとダウンロード'
    runtime: jakarta
    run: 'gradle:payaraRun'
    preview: '/jakarta-servlet-file-upload/'
    suggestName: jakarta-servlet-file-upload
    names:
      ja: 'マルチパートと @MultipartConfig・Part'
      en: 'Multipart with @MultipartConfig and Part'
    descriptions:
      ja: >-
        @MultipartConfig を付けた FileUploadServlet が Part を受け取り、FileStorageService が検証して保存します。結果は /files/result?id=… の GET で表示します（PRG）。
        ▶ アプリ実行で http://localhost:8080/jakarta-servlet-file-upload/ のアップロード画面が開きます。
        curl/ のスクリプトで、受け付けない形式・空のファイル・5MB を超えるファイル（413）を確かめてください。
      en: >-
        FileUploadServlet with @MultipartConfig receives the Part, and FileStorageService validates and stores it. The result is shown by a GET to /files/result?id=... (PRG).
        ▶ Run app opens the upload page at http://localhost:8080/jakarta-servlet-file-upload/.
        Use the scripts in curl/ to try a rejected format, an empty file and a file over 5 MB (413).
    openFiles:
      - README.md

  - id: jakarta-faces-file-upload
    chapter: 8
    lesson: '8.1 ファイルのアップロードとダウンロード'
    runtime: jakarta
    run: 'gradle:payaraRun'
    preview: '/jakarta-faces-file-upload/FileUploadPage.xhtml'
    suggestName: jakarta-faces-file-upload
    names:
      ja: 'Faces の h:inputFile と保存処理の検証'
      en: 'h:inputFile in Faces and validating the stored file'
    descriptions:
      ja: >-
        h:inputFile の値が Part として FileUploadBean に設定され、FileStorageService が受け付けないと判断した理由は入力欄のメッセージになります。
        ▶ アプリ実行で http://localhost:8080/jakarta-faces-file-upload/FileUploadPage.xhtml が開きます。curl/01_upload.sh で、accept をすり抜けた .exe が拒否されることを確かめてください。
      en: >-
        The value of h:inputFile is set to FileUploadBean as a Part, and the reason FileStorageService rejects a file becomes the message of the input field.
        ▶ Run app opens http://localhost:8080/jakarta-faces-file-upload/FileUploadPage.xhtml. Use curl/01_upload.sh to see that an .exe sent past accept is rejected.
    openFiles:
      - README.md

  - id: jakarta-servlet-file-download
    chapter: 8
    lesson: '8.1 ファイルのアップロードとダウンロード'
    runtime: jakarta
    run: 'gradle:payaraRun'
    preview: '/jakarta-servlet-file-download/'
    suggestName: jakarta-servlet-file-download
    names:
      ja: 'HTTP レスポンスとしてのダウンロード'
      en: 'Downloads as HTTP responses'
    descriptions:
      ja: >-
        FileDownloadServlet が C:/tmp/output の下のファイルを、Content-Type・Content-Length・Content-Disposition を付けて返します。
        先に curl/01_prepare_sample.sh をエディタの右上の ▶ 実行で流してファイルを用意し、▶ アプリ実行で http://localhost:8080/jakarta-servlet-file-download/ を開いてください。
        curl/02_download.sh・curl/03_not_found.sh で応答ヘッダーと 404 を確かめられます。
      en: >-
        FileDownloadServlet returns files under C:/tmp/output with Content-Type, Content-Length and Content-Disposition.
        First run curl/01_prepare_sample.sh with ▶ Run at the top right of the editor to create the files, then ▶ Run app and open http://localhost:8080/jakarta-servlet-file-download/.
        curl/02_download.sh and curl/03_not_found.sh show the response headers and the 404.
    openFiles:
      - README.md

  # ── チャプター9: DataSource と JDBC ────────────────────
  - id: jakarta-faces-employee-jdbc
    chapter: 9
    lesson: '9.1 DataSourceとJDBCによるデータベースアクセス'
    runtime: jakarta
    run: 'gradle:payaraRun'
    preview: '/jakarta-faces-employee-jdbc/EmployeeTablePage.xhtml'
    suggestName: jakarta-faces-employee-jdbc
    names:
      ja: 'DataSource と JDBC の社員管理'
      en: 'Employee app with DataSource and JDBC'
    descriptions:
      ja: >-
        @DataSourceDefinition で定義した DataSource を @Resource で受け取り、EmployeeRepository が PreparedStatement で検索・登録・更新・論理削除します。
        ▶ アプリ実行で http://localhost:8080/jakarta-faces-employee-jdbc/EmployeeTablePage.xhtml が開きます。検索・ページ送り・登録・編集・削除を操作してください。
        curl/ のスクリプトで、更新の競合（version）も確かめられます。DB はデプロイのたびに初期データへ戻ります。
      en: >-
        The DataSource defined with @DataSourceDefinition is injected with @Resource, and EmployeeRepository searches, inserts, updates and logically deletes with PreparedStatement.
        ▶ Run app opens http://localhost:8080/jakarta-faces-employee-jdbc/EmployeeTablePage.xhtml. Search, page, create, edit and delete.
        The scripts in curl/ also show the update conflict (version). The DB returns to the initial data on every deployment.
    openFiles:
      - README.md

  # ── チャプター10: Jakarta Persistence ────────────────────
  - id: jakarta-faces-employee-jpa
    chapter: 10
    lesson: '10.1 Jakarta Persistenceと永続化コンテキスト'
    runtime: jakarta
    run: 'gradle:payaraRun'
    preview: '/jakarta-faces-employee-jpa/EmployeeTablePage.xhtml'
    suggestName: jakarta-faces-employee-jpa
    names:
      ja: 'Jakarta Persistence の社員管理'
      en: 'Employee app with Jakarta Persistence'
    descriptions:
      ja: >-
        同じ画面とテーブルを、@Entity のマッピングと EntityManager で読み書きします。更新の競合は @Version、更新と論理削除は永続化コンテキストの変更の検出で反映します。
        ▶ アプリ実行で http://localhost:8080/jakarta-faces-employee-jpa/EmployeeTablePage.xhtml が開きます。
        操作のたびに、実行結果に EclipseLink が発行した SQL が出ます。
      en: >-
        The same pages and tables are read and written with @Entity mappings and EntityManager. Conflicts are detected with @Version, and updates and logical deletes are applied by change detection in the persistence context.
        ▶ Run app opens http://localhost:8080/jakarta-faces-employee-jpa/EmployeeTablePage.xhtml.
        Each operation prints the SQL issued by EclipseLink in the run output.
    openFiles:
      - README.md

  # ── チャプター11: Criteria API と Jakarta Data ────────────────────
  - id: jakarta-faces-employee-criteria
    chapter: 11
    lesson: '11.1 Criteria APIとJakarta Dataによる検索'
    runtime: jakarta
    run: 'gradle:payaraRun'
    preview: '/jakarta-faces-employee-criteria/EmployeeTablePage.xhtml'
    suggestName: jakarta-faces-employee-criteria
    names:
      ja: 'Criteria API と静的メタモデルによる検索'
      en: 'Queries with the Criteria API and the static metamodel'
    descriptions:
      ja: >-
        EmployeeRepository の検索を、指定された条件だけを組み立てる Criteria API に書き換えています。属性はアノテーションプロセッサが生成する Employee_ などで参照します。
        ▶ アプリ実行で http://localhost:8080/jakarta-faces-employee-criteria/EmployeeTablePage.xhtml を開き、条件を変えて検索し、実行結果の SQL を見比べてください。
      en: >-
        The search in EmployeeRepository is rewritten with the Criteria API, which builds only the given conditions. Attributes are referenced through Employee_ and the like, generated by an annotation processor.
        ▶ Run app, open http://localhost:8080/jakarta-faces-employee-criteria/EmployeeTablePage.xhtml, search with different conditions and compare the SQL in the run output.
    openFiles:
      - README.md

  - id: jakarta-data-employee
    chapter: 11
    lesson: '11.1 Criteria APIとJakarta Dataによる検索'
    runtime: jakarta
    run: 'gradle:payaraRun'
    preview: '/jakarta-data-employee/EmployeeTablePage.xhtml'
