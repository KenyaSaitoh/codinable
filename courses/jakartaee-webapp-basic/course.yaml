      en: 'Jakarta Data repositories and paging'
    descriptions:
      ja: >-
        EmployeeRepository をインタフェースの宣言だけで書き、メソッド名による問い合わせ・@Find・@Query と PageRequest で検索します。実装クラスは Payara Server のプロバイダーが生成します。
        ▶ アプリ実行で http://localhost:8080/jakarta-data-employee/EmployeeTablePage.xhtml が開きます。氏名と月給の範囲で検索し、社員コードで編集画面を開いてください。
      en: >-
        EmployeeRepository is only an interface declaration, and searches use query by method name, @Find, @Query and PageRequest. The provider in Payara Server generates the implementation.
        ▶ Run app opens http://localhost:8080/jakarta-data-employee/EmployeeTablePage.xhtml. Search by name and salary range, and open the edit page by employee code.
    openFiles:
      - README.md

  # ── チャプター12: Jakarta Transactions ────────────────────
  - id: jakarta-tx
    chapter: 12
    lesson: '12.1 Jakarta Transactionsによるトランザクション管理と伝播'
    runtime: jakarta
    run: 'gradle:payaraRun'
    preview: '/jakarta-tx/'
    suggestName: jakarta-tx
    names:
      ja: 'REQUIRED と REQUIRES_NEW の伝播'
      en: 'REQUIRED vs REQUIRES_NEW propagation'
    descriptions:
      ja: >-
        FooBean（REQUIRED）が BarBean（REQUIRES_NEW）と QuxBean（REQUIRED）を呼び、QuxBean は引数が負なら更新した後に例外を送出します。
        ▶ アプリ実行で http://localhost:8080/jakarta-tx/ を開き、100 と -5 を送ってから BUSINESS テーブルの値を見てください。
        curl/02_user_transaction.sh では、UserTransaction で 1 件ずつ確定・取り消しする BazBean を確かめられます。
      en: >-
        FooBean (REQUIRED) calls BarBean (REQUIRES_NEW) and QuxBean (REQUIRED); QuxBean throws after its update when the argument is negative.
        ▶ Run app, open http://localhost:8080/jakarta-tx/, send 100 and -5, and look at the BUSINESS table.
        curl/02_user_transaction.sh shows BazBean, which commits or rolls back one item at a time with UserTransaction.
    openFiles:
      - README.md

