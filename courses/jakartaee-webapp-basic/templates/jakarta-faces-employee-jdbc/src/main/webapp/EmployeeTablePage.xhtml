<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
  <title>EmployeeTablePage</title>
<style>
  /* コースのテーマカラー（#345065 / #486A83 / #7299B5）で社員管理の画面を整える */
  body { font-family: "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", sans-serif; color: #1F2D3A; background: #F6F8FA; margin: 0; padding: 20px 28px; }
  h1, h2 { color: #345065; font-size: 22px; margin: 0 0 12px; padding-bottom: 8px; border-bottom: 3px solid #486A83; }
  hr { display: none; }
  form { margin: 8px 0; }
  label { color: #486A83; font-size: 13px; margin: 0 4px 0 10px; }
  input[type=text], input[type=number], input[type=date], select { border: 1px solid #CBD5DD; border-radius: 4px; padding: 4px 6px; font-size: 14px; background: #fff; }
  button, input[type=submit] { background: #486A83; color: #fff; border: 0; border-radius: 4px; padding: 5px 14px; font-size: 14px; cursor: pointer; margin: 0 2px; }
  button:hover, input[type=submit]:hover { background: #345065; }
  button:disabled { background: #B8C4CE; cursor: default; }
  button.delete, input[value="削除"] { background: #9A5B5B; }
  a { color: #345065; }
  table { border-collapse: collapse; margin: 12px 0; background: #fff; font-size: 14px; }
  th, td { border: 1px solid #CBD5DD; padding: 6px 12px; }
  th { background: #486A83; color: #fff; font-weight: 600; text-align: left; }
  tr:nth-child(even) td { background: #EEF2F5; }
  td button, td input[type=submit] { padding: 3px 10px; font-size: 13px; }
  .error, [style*="color: red"], [style*="color:red"] { color: #B4423F; }
</style>
</h:head>
<h:body>
  <h2>社員一覧</h2>
  <hr />
  <h:messages globalOnly="true" infoStyle="color: green" errorStyle="color: red" />
  <h:form id="searchForm">
    <div>
      <h:outputLabel for="keyword" value="氏名" />
      <h:inputText id="keyword" value="#{employeeTableBean.criteria.keyword}" />
      <h:outputLabel for="departmentId" value="部署" />
      <h:selectOneMenu id="departmentId" value="#{employeeTableBean.criteria.departmentId}">
        <f:selectItem itemLabel="（指定なし）" noSelectionOption="true" />
        <f:selectItems value="#{employeeTableBean.departments}" var="d"
                       itemValue="#{d.departmentId}" itemLabel="#{d.departmentName}" />
      </h:selectOneMenu>
      <h:outputLabel for="jobId" value="役職" />
      <h:selectOneMenu id="jobId" value="#{employeeTableBean.criteria.jobId}">
        <f:selectItem itemLabel="（指定なし）" noSelectionOption="true" />
        <f:selectItems value="#{employeeTableBean.jobs}" var="j"
                       itemValue="#{j.jobId}" itemLabel="#{j.jobName}" />
      </h:selectOneMenu>
    </div>
    <div>
      <h:outputLabel for="salaryFrom" value="月給" />
      <h:inputText id="salaryFrom" value="#{employeeTableBean.criteria.salaryFrom}" size="8" label="月給の下限" />
      〜
      <h:inputText id="salaryTo" value="#{employeeTableBean.criteria.salaryTo}" size="8" label="月給の上限" />
      <h:commandButton id="searchButton" value="検索" action="#{employeeTableBean.search}" />
      <h:message for="salaryFrom" style="color: red" />
      <h:message for="salaryTo" style="color: red" />
    </div>

    <p>#{employeeTableBean.totalCount} 件（#{employeeTableBean.page} / #{employeeTableBean.totalPages} ページ）</p>
    <h:dataTable id="employeeTable" value="#{employeeTableBean.rows}" var="row" border="1"
                 rendered="#{not empty employeeTableBean.rows}">
      <h:column>
        <f:facet name="header">ID</f:facet>
        #{row.employeeId}
      </h:column>
      <h:column>
        <f:facet name="header">社員コード</f:facet>
        #{row.employeeCode}
      </h:column>
      <h:column>
        <f:facet name="header">氏名</f:facet>
        #{row.employeeName}
      </h:column>
      <h:column>
        <f:facet name="header">部署</f:facet>
        #{empty row.departmentName ? '（所属なし）' : row.departmentName}
      </h:column>
      <h:column>
        <f:facet name="header">役職</f:facet>
        #{row.jobName}
      </h:column>
      <h:column>
        <f:facet name="header">月給</f:facet>
        <h:outputText value="#{row.salary}">
          <f:convertNumber pattern="#,##0円" />
        </h:outputText>
      </h:column>
      <h:column>
        <f:facet name="header">入社日</f:facet>
        <h:outputText value="#{row.entranceDate}">
          <f:convertDateTime type="localDate" pattern="yyyy-MM-dd" />
        </h:outputText>
      </h:column>
      <h:column>
        <f:facet name="header">操作</f:facet>
        <h:link outcome="EmployeeFormPage" value="編集">
          <f:param name="employeeId" value="#{row.employeeId}" />
        </h:link>
        <h:commandButton id="deleteButton" value="削除" action="#{employeeTableBean.delete(row.employeeId)}"
                         onclick="return confirm('削除しますか？')" />
      </h:column>
    </h:dataTable>
    <div>
      <h:commandButton id="prevButton" value="前へ" action="#{employeeTableBean.prev}"
                       disabled="#{not employeeTableBean.hasPrev}" />
      <h:commandButton id="nextButton" value="次へ" action="#{employeeTableBean.next}"
                       disabled="#{not employeeTableBean.hasNext}" />
    </div>
  </h:form>
  <hr />
  <h:link outcome="EmployeeFormPage" value="新規登録" />
</h:body>
</html>
