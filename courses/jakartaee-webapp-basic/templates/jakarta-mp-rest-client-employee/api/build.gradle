// employee-api: 確認用の社員 API（ルートの Rest Client から呼び出される側）。ルートと同じ Payara Server に一緒にデプロイする（codinable.services.json の wars）
// ▶ アプリ実行で WAR を作り、Codinable 同梱の Payara Server 7 へデプロイする
plugins {
    id 'war'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    // 仕様の API はコンパイル時だけ使う。実装は Payara Server が持つので WAR には入れない
    compileOnly 'jakarta.platform:jakarta.jakartaee-web-api:11.0.0'
}

war {
    // WAR のファイル名が、そのままコンテキストルート（/employee-api）になる。ルートの Rest Client はこの API を呼び出す
    archiveFileName = 'employee-api.war'
}
