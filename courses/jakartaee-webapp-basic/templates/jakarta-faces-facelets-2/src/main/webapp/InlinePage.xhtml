<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:pt="jakarta.faces.passthrough">
<h:head>
  <title>InlinePage</title>
  <h:outputStylesheet library="css" name="style.css" />
</h:head>
<h:body>
  <h2>3. JavaScript への値の受け渡し</h2>
  <hr />
  <!-- pt: の属性は data-member-name としてそのまま HTML へ出る -->
  <h:panelGroup layout="block" id="memberData"
                pt:data-member-name="#{inlineBean.memberName}" />
  <span id="greeting"></span>
  <h:outputScript library="js" name="member.js" />
  <hr />
  <h:link outcome="IndexPage" value="目次へ戻る" />
</h:body>
</html>
