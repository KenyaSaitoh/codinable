// jakarta-faces-calc-6-history: ビューパラメータによる保存済みデータの再取得（計算アプリケーション 6）
// ▶ アプリ実行で WAR を作り、Codinable 同梱の Payara Server 7 へデプロイする
plugins {
    id 'war'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    // 仕様の API はコンパイル時だけ使う。実装は Payara Server が持つので WAR には入れない
    compileOnly 'jakarta.platform:jakarta.jakartaee-web-api:11.0.0'
    // 設定値の注入（MicroProfile Config）。Payara Server が実装を持つ
    compileOnly 'org.eclipse.microprofile.config:microprofile-config-api:3.1'
}

war {
    // WAR のファイル名が、そのままコンテキストルート（/jakarta-faces-calc-6-history）になる
    archiveFileName = 'jakarta-faces-calc-6-history.war'
}
