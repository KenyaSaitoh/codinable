<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<f:metadata>
  <f:viewParam name="employeeId" value="#{employeeFormBean.employeeId}" />
  <f:viewAction action="#{employeeFormBean.load}" />
</f:metadata>
<h:head>
  <title>EmployeeFormPage</title>
<style>
  /* コースのテーマカラー（#345065 / #486A83 / #7299B5）で社員管理の画面を整える */
  body { font-family: "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", sans-serif; color: #1F2D3A; background: #F6F8FA; margin: 0; padding: 20px 28px; }
  h1, h2 { color: #345065; font-size: 22px; margin: 0 0 12px; padding-bottom: 8px; border-bottom: 3px solid #486A83; }
  hr { display: none; }
  form { margin: 8px 0; }
  label { color: #486A83; font-size: 13px; margin: 0 4px 0 10px; }
  input[type=text], input[type=number], input[type=date], select { border: 1px solid #CBD5DD; border-radius: 4px; padding: 4px 6px; font-size: 14px; background: #fff; }
  button, input[type=submit] { background: #486A83; color: #fff; border: 0; border-radius: 4px; padding: 5px 14px; font-size: 14px; cursor: pointer; margin: 0 2px; }
  button:hover, input[type=submit]:hover { background: #345065; }
  button:disabled { background: #B8C4CE; cursor: default; }
  button.delete, input[value="削除"] { background: #9A5B5B; }
  a { color: #345065; }
  table { border-collapse: collapse; margin: 12px 0; background: #fff; font-size: 14px; }
  th, td { border: 1px solid #CBD5DD; padding: 6px 12px; }
  th { background: #486A83; color: #fff; font-weight: 600; text-align: left; }
  tr:nth-child(even) td { background: #EEF2F5; }
  td button, td input[type=submit] { padding: 3px 10px; font-size: 13px; }
  .error, [style*="color: red"], [style*="color:red"] { color: #B4423F; }
</style>
</h:head>
<h:body>
  <h2>#{empty employeeFormBean.employeeId ? '社員の登録' : '社員の編集'}</h2>
  <hr />
  <h:messages globalOnly="true" style="color: red" />
  <h:form id="employeeForm">
    <div>社員ID: #{empty employeeFormBean.employeeId ? '（登録時に採番）' : employeeFormBean.employeeId}
      #{employeeFormBean.employeeCode}
      #{empty employeeFormBean.version ? '' : '（version ' += employeeFormBean.version += '）'}</div>
    <div>
      <h:outputLabel for="employeeName" value="氏名" />
      <h:inputText id="employeeName" value="#{employeeFormBean.employeeName}" label="氏名" />
      <h:message for="employeeName" style="color: red" />
    </div>
    <div>
      <h:outputLabel for="departmentId" value="部署" />
      <h:selectOneMenu id="departmentId" value="#{employeeFormBean.departmentId}">
        <f:selectItem itemLabel="（所属なし）" noSelectionOption="true" />
        <f:selectItems value="#{employeeFormBean.departments}" var="d"
                       itemValue="#{d.departmentId}" itemLabel="#{d.departmentName}" />
      </h:selectOneMenu>
    </div>
    <div>
      <h:outputLabel for="jobId" value="役職" />
      <h:selectOneMenu id="jobId" value="#{employeeFormBean.jobId}" label="役職">
        <f:selectItem itemLabel="（選択してください）" noSelectionOption="true" />
        <f:selectItems value="#{employeeFormBean.jobs}" var="j"
                       itemValue="#{j.jobId}" itemLabel="#{j.jobName}" />
      </h:selectOneMenu>
      <h:message for="jobId" style="color: red" />
    </div>
    <div>
      <h:outputLabel for="salary" value="月給" />
      <h:inputText id="salary" value="#{employeeFormBean.salary}" label="月給" />
      <h:message for="salary" style="color: red" />
    </div>
    <div>
      <h:outputLabel for="entranceDate" value="入社日（yyyy-MM-dd）" />
      <h:inputText id="entranceDate" value="#{employeeFormBean.entranceDate}" label="入社日">
        <f:convertDateTime type="localDate" pattern="yyyy-MM-dd" />
      </h:inputText>
      <h:message for="entranceDate" style="color: red" />
    </div>
    <!-- 編集を始めたときの version を隠し項目として保持し、更新のときに Service へ渡す -->
    <h:inputHidden id="version" value="#{employeeFormBean.version}" />
    <h:commandButton id="saveButton" value="保存" action="#{employeeFormBean.save}" />
  </h:form>
  <hr />
  <h:link outcome="EmployeeTablePage" value="一覧へ戻る" />
</h:body>
</html>
