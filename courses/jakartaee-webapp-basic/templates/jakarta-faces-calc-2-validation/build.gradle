// jakarta-faces-calc-2-validation: コンバーターと Bean Validation・FacesMessage（計算アプリケーション 2）
// ▶ アプリ実行で WAR を作り、Codinable 同梱の Payara Server 7 へデプロイする
plugins {
    id 'war'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    // 仕様の API はコンパイル時だけ使う。実装は Payara Server が持つので WAR には入れない
    compileOnly 'jakarta.platform:jakarta.jakartaee-web-api:11.0.0'
}

war {
    // WAR のファイル名が、そのままコンテキストルート（/jakarta-faces-calc-2-validation）になる
    archiveFileName = 'jakarta-faces-calc-2-validation.war'
}
