// jakarta-faces-employee: CDI によるレイヤー設計と Faces の画面・会話スコープ（メモリー版の社員管理）
// ▶ アプリ実行で WAR を作り、Codinable 同梱の Payara Server 7 へデプロイする
plugins {
    id 'war'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    // 仕様の API はコンパイル時だけ使う。実装は Payara Server が持つので WAR には入れない
    compileOnly 'jakarta.platform:jakarta.jakartaee-web-api:11.0.0'
}

war {
    // WAR のファイル名が、そのままコンテキストルート（/jakarta-faces-employee）になる
    archiveFileName = 'jakarta-faces-employee.war'
}

dependencies {
    // テストでは EmployeeService と EmployeeDAO を new して使う（アノテーションのクラスだけ要る）
    testImplementation 'jakarta.platform:jakarta.jakartaee-web-api:11.0.0'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}
