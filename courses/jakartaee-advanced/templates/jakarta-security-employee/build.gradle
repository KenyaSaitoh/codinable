// jakarta-security-employee: Jakarta Security のフォーム認証と認可、パスワードのハッシュ化、CSRF 対策
// ▶ アプリ実行で WAR を作り、Codinable 同梱の Payara Server 7 へデプロイする
// React の画面（frontend/）は Vite の開発サーバー（5173）で動き、/api を 8080 の Payara Server へ転送する
// （codinable.services.json の processes で、▶ アプリ実行と一緒に起動する）
plugins {
    id 'war'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    // 仕様の API はコンパイル時だけ使う。実装は Payara Server が持つので WAR には入れない
    compileOnly 'jakarta.platform:jakarta.jakartaee-api:11.0.0'
}

war {
    // WAR のファイル名が、そのままコンテキストルート（/jakarta-security-employee）になる
    archiveFileName = 'jakarta-security-employee.war'
}
