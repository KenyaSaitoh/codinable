employee-api/mp-rest/url=http://localhost:8095
employee-api/mp-rest/connectTimeout=1000
employee-api/mp-rest/readTimeout=2000

# Payara の場合（7.2026.9 で確認）: @CircuitBreaker の delayUnit = ChronoUnit.SECONDS が効かず、
# delay = 10 が 10 ミリ秒として扱われて、遮断（OPEN）が直ちに試験状態（HALF_OPEN）へ移ってしまう
# 同じ 10 秒をミリ秒で与え直して、アノテーションに書いた意図どおりに動かす
pro.kensait.jakartaee.employee.service.EmployeeClientService/getEmployees/CircuitBreaker/delay=10000
pro.kensait.jakartaee.employee.service.EmployeeClientService/getEmployees/CircuitBreaker/delayUnit=MILLIS

# アノテーションの属性値を MicroProfile Config で上書きする例（レッスン9.1.5）
# 行頭の # を外して ▶ アプリ実行し直すと効く（この演習の既定の動きを変えないよう、最初はすべて無効にしてある）
# 特定のメソッドの属性
#pro.kensait.jakartaee.employee.service.EmployeeClientService/getEmployees/CircuitBreaker/requestVolumeThreshold=10
#pro.kensait.jakartaee.employee.service.EmployeeClientService/getEmployeesWithRetry/Retry/maxRetries=3
# アプリケーション全体の属性
#Timeout/value=5000
# アノテーションの無効化
#Bulkhead/enabled=false
