<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<f:metadata>
    <f:viewParam name="id" value="#{employeeDeleteBean.id}" required="true"/>
    <f:viewAction action="#{employeeDeleteBean.load}"/>
</f:metadata>
<h:head>
    <title>社員の削除</title>
    <h:outputStylesheet name="style.css"/>
</h:head>
<h:body>
    <main>
        <h1>社員の削除</h1>
        <p>次の社員を削除します。</p>
        <p>#{employeeDeleteBean.employee.employeeId} #{employeeDeleteBean.employee.employeeName}</p>
        <h:form id="confirm">
            <h:commandButton id="delete" value="削除する" action="#{employeeDeleteBean.delete}"/>
            <h:link value="戻る" outcome="/employees/list.xhtml"/>
        </h:form>
    </main>
</h:body>
</html>
