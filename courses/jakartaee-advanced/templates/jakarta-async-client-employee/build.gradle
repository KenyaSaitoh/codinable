// jakarta-async-client-employee: 確認用の社員API（このフォルダ直下）
// ▶ アプリ実行で WAR を作り、Codinable 同梱の Payara Server 7 へデプロイする
// 呼び出し側の Java コンソールは client/ にある別の Gradle プロジェクト（client/run.sh で動かす）
plugins {
    id 'war'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    // 仕様の API はコンパイル時だけ使う。実装は Payara Server が持つので WAR には入れない
    compileOnly 'jakarta.platform:jakarta.jakartaee-api:11.0.0'
}

war {
    // WAR のファイル名が、そのままコンテキストルート（/jakarta-async-client-employee）になる
    archiveFileName = 'jakarta-async-client-employee.war'
}
