// jakarta-websocket-employee: Jakarta WebSocket による社員通知
// ▶ アプリ実行で WAR を作り、Codinable 同梱の Payara Server 7 へデプロイする
// 通知の画面（src/main/webapp）とエンドポイントが同じ WAR にあるので、開発用の転送の仕組みは使わない
plugins {
    id 'war'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    // 仕様の API はコンパイル時だけ使う。実装は Payara Server が持つので WAR には入れない
    compileOnly 'jakarta.platform:jakarta.jakartaee-api:11.0.0'
    compileOnly 'org.eclipse.microprofile.config:microprofile-config-api:3.1'
}

war {
    // WAR のファイル名が、そのままコンテキストルート（/jakarta-websocket-employee）になる
    archiveFileName = 'jakarta-websocket-employee.war'
}
