# MicroProfile Telemetry を有効にする（既定は無効）
otel.sdk.disabled=false
otel.service.name=jakarta-telemetry-employee
# 記録したスパンの送り先
# 講座本編では OTLP で Jaeger（http://localhost:4318）へ送るが、Codinable では外部の受信先を用意しないので、
# 実行結果（Payara Server のログ）へ書き出す console にしている（送信先が無くてもエラーにならない）
# Jaeger などの受信先がある環境では、次の 3 行を otlp に切り替える
#   otel.traces.exporter=otlp
#   otel.exporter.otlp.protocol=http/protobuf
#   otel.exporter.otlp.endpoint=http://localhost:4318
otel.traces.exporter=console
otel.metrics.exporter=none
otel.logs.exporter=none
otel.traces.sampler=parentbased_always_on
