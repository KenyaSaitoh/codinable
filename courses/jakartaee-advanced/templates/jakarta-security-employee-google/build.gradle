// jakarta-security-employee-google: Google を IdP とする OpenID Connect のログイン
// ▶ アプリ実行で WAR を作り、Codinable 同梱の Payara Server 7 へデプロイする
// React の画面（frontend/）は Vite の開発サーバー（5173）で動く（codinable.services.json の processes）
// ログインには Google 側でのクライアントの登録が要る（README 参照）
plugins {
    id 'war'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    // 仕様の API はコンパイル時だけ使う。実装は Payara Server が持つので WAR には入れない
    compileOnly 'jakarta.platform:jakarta.jakartaee-api:11.0.0'
    compileOnly 'org.eclipse.microprofile.config:microprofile-config-api:3.1'
}

war {
    // WAR のファイル名が、そのままコンテキストルート（/jakarta-security-employee-google）になる
    archiveFileName = 'jakarta-security-employee-google.war'
}
