# MicroProfile Telemetry を有効にする（既定は無効。無効のままだと EmployeeService のカウンターに何も記録されない）
otel.sdk.disabled=false
otel.service.name=jakarta-health-employee
# メトリクスは、Codinable では外部の受信先（OpenTelemetry Collector など）を用意しないので、
# OTLP で送る代わりに実行結果（Payara Server のログ）へ 60 秒ごとに書き出す
otel.metrics.exporter=console
otel.metric.export.interval=60000
# トレースとログは、この演習では送らない（トレースは jakarta-telemetry-employee で扱う）
otel.traces.exporter=none
otel.logs.exporter=none
