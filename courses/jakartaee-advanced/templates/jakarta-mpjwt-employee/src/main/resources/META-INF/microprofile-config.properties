# 【1】 発行者が公開する鍵の集合（JWKS）
mp.jwt.verify.publickey.location=http://localhost:8080/jakarta-mpjwt-issuer/realms/learn/protocol/openid-connect/certs
# 【2】 受け入れる発行者
mp.jwt.verify.issuer=http://localhost:8080/jakarta-mpjwt-issuer/realms/learn
# 【3】 受け入れる受信者
mp.jwt.verify.audiences=employee-api
# 【4】 受け入れる署名アルゴリズム
mp.jwt.verify.publickey.algorithm=RS256
# 【5】 時刻のずれの許容（秒）
mp.jwt.verify.clock.skew=30
