// jakarta-async-employee の SSE の受信クライアント（EmployeeStreamClient）
// Jakarta REST のクライアントAPI の SseEventSource で、ルートの GET /api/employees/stream を受信する
// ルートを ▶ アプリ実行でデプロイしてから、client/run.sh を開いてエディタの右上の ▶ 実行で動かす
plugins {
    id 'java'
    id 'application'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    // Jakarta REST のクライアントAPI と、その実装の Jersey（SSE と JSON-B）
    implementation 'jakarta.ws.rs:jakarta.ws.rs-api:4.0.0'
    implementation 'org.glassfish.jersey.core:jersey-client:4.0.0'
    implementation 'org.glassfish.jersey.inject:jersey-hk2:4.0.0'
    implementation 'org.glassfish.jersey.media:jersey-media-sse:4.0.0'
    implementation 'org.glassfish.jersey.media:jersey-media-json-binding:4.0.0'
}

application {
    mainClass = 'pro.kensait.jakartaee.employee.client.EmployeeStreamClient'
    applicationDefaultJvmArgs = ['-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8']
}
