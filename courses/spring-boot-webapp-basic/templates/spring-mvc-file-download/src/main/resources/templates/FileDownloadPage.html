<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>FileDownloadPage</title>
  <meta charset="UTF-8">
</head>
<body>
<h2>Download File</h2>
<form th:action="@{/download}" method="GET">
  <label for="fileName">File Name:</label>
  <input type="text" id="fileName" name="fileName" required>
  <button type="submit">Download</button>
</form>
<div th:if="${fileName != null}">
  <h3>Click the link below to download the file:</h3>
  <a th:href="@{'/download/' + ${fileName}}">Download <span th:text="${fileName}">file</span></a>
</div>
</body>
</html>
