// spring-mvc-file-download: Resource と ResponseEntity によるダウンロード
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

// 講座のサンプル（learn_spring_aidd_basic）はマルチプロジェクト構成で、共通の設定を
// 親の build.gradle に置いている。Codinable では演習フォルダ単独で動かすため、
// 必要な設定だけをこの 1 ファイルに畳んだ（品質ゲート用の Checkstyle / SpotBugs /
// PIT などは省いた）。依存のバージョンは Spring Boot の BOM に任せる
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot 4 では spring-boot-starter-web は spring-boot-starter-webmvc に改名された
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    // FileDownloadController が jakarta.ws.rs.core.HttpHeaders の定数を参照するため、
    // コンパイル時だけ JAX-RS の API を足す（サンプルは jakarta.jakartaee-api 全体を入れていた）
    compileOnly 'jakarta.ws.rs:jakarta.ws.rs-api'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}
