server:
  port: 8080

spring:
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false
    servlet:
      content-type: text/html
  datasource:
    # Codinable が起こす HSQLDB サーバー（localhost:9001 の testdb。中身はインメモリ）につなぐ
    # 「▶ アプリ実行」で DB も一緒に起動し、SQL タブから同じ DB を SELECT で確かめられる
    # 起動のたびに下の SQL で作り直すので、登録・更新した内容はアプリを止めると初期データに戻る
    url: jdbc:hsqldb:hsql://localhost:9001/testdb
    username: SA
    password:
    driver-class-name: org.hsqldb.jdbc.JDBCDriver
  sql:
    init:
      # sql/hsqldb の DDL と初期データ（build.gradle で classpath:db/ へ入れている）を起動時に流す
      mode: always
      schema-locations: classpath:db/2_EMPLOYEE_DDL.sql
      data-locations: classpath:db/3_EMPLOYEE_DML.sql

mybatis:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: INFO
    org.springframework: INFO
    pro.kensait.spring.employee: INFO
