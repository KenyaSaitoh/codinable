// spring-mvc-tx: @Transactional の伝播（REQUIRED / REQUIRES_NEW）
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

// 講座のサンプル（learn_spring_aidd_basic）はマルチプロジェクト構成で、共通の設定を
// 親の build.gradle に置いている。Codinable では演習フォルダ単独で動かすため、
// 必要な設定だけをこの 1 ファイルに畳んだ（品質ゲート用の Checkstyle / SpotBugs /
// PIT などは省いた）。依存のバージョンは Spring Boot の BOM に任せる
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot 4 では spring-boot-starter-web は spring-boot-starter-webmvc に改名された
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // これがないと DataSource がインジェクションできず起動時にエラー（spring-tx も含まれる）
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    // jakarta.transaction のクラスが起動時に必要
    implementation 'jakarta.transaction:jakarta.transaction-api'
    // HSQLDB の JDBC ドライバー（サンプルは同梱の hsqldb.jar を参照していた）
    runtimeOnly 'org.hsqldb:hsqldb'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

// SQL の正本は sql/hsqldb。Codinable では HSQLDB サーバーを使わずインメモリで動かすため、
// 起動時に流す DDL と初期データを classpath:db/ へ入れる（application.yml の spring.sql.init が参照する）
processResources {
    from('sql/hsqldb') {
        include '1_SPRING_TX_DDL.sql', '2_SPRING_TX_DML.sql'
        into 'db'
    }
}
