<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>CalcHistoryPage2</title>
<meta http-equiv="content-type" content="text/html; charset=UTF-8" />
</head>
<body>
  <h2>CalcHistoryPage2</h2>
  <hr />
  <table border="1">
    <thead>
      <tr>
        <th>計算日時</th>
        <th>ID</th>
      </tr>
    </thead>
    <tbody th:each="calc: ${calcResults}" th:object="${calc}">
      <tr>
        <td th:text="*{dateTimeStr}"></td>
        <td>
          <a th:href="@{/viewResultByQuery(id=*{id})}"
             th:text="*{id}"></a>
        </td>
      </tr>
    </tbody>
  </table>
  <form method="GET">
    <button type="submit" th:formaction="@{/}">入力画面へ</button>
  </form>
</body>
</html>
