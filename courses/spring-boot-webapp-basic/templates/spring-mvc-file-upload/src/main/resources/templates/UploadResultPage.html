<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>アップロード結果</title>
</head>
<body>
<h1>アップロード結果</h1>
<dl>
  <dt>ID</dt>
  <dd th:text="${storedFile.id}"></dd>
  <dt>タイトル</dt>
  <dd th:text="${storedFile.title}"></dd>
  <dt>ファイル名</dt>
  <dd th:text="${storedFile.originalName}"></dd>
  <dt>サイズ</dt>
  <dd th:text="${storedFile.size}"></dd>
</dl>
<a href="/">続けてアップロードする</a>
</body>
</html>
