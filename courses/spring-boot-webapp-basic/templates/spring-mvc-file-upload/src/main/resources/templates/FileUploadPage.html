<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ファイルアップロード</title>
</head>
<body>
<h1>ファイルアップロード</h1>
<form action="/files" method="post" enctype="multipart/form-data">
  <label>
    タイトル
    <input type="text" name="title" required>
  </label>
  <label>
    ファイル
    <input type="file" name="file" required>
  </label>
  <button type="submit">保存</button>
</form>
</body>
</html>
