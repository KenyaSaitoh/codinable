<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
<meta charset="UTF-8" />
<title>社員管理</title>
<style>
  /* コースのテーマカラー（#345065 / #486A83 / #7299B5）で社員管理の画面を整える */
  body { font-family: "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", sans-serif; color: #1F2D3A; background: #F6F8FA; margin: 0; padding: 20px 28px; }
  h1, h2 { color: #345065; font-size: 22px; margin: 0 0 12px; padding-bottom: 8px; border-bottom: 3px solid #486A83; }
  hr { display: none; }
  form { margin: 8px 0; }
  label { color: #486A83; font-size: 13px; margin: 0 4px 0 10px; }
  input[type=text], input[type=number], input[type=date], select { border: 1px solid #CBD5DD; border-radius: 4px; padding: 4px 6px; font-size: 14px; background: #fff; }
  button, input[type=submit] { background: #486A83; color: #fff; border: 0; border-radius: 4px; padding: 5px 14px; font-size: 14px; cursor: pointer; margin: 0 2px; }
  button:hover, input[type=submit]:hover { background: #345065; }
  button:disabled { background: #B8C4CE; cursor: default; }
  button.delete, input[value="削除"] { background: #9A5B5B; }
  a { color: #345065; }
  table { border-collapse: collapse; margin: 12px 0; background: #fff; font-size: 14px; }
  th, td { border: 1px solid #CBD5DD; padding: 6px 12px; }
  th { background: #486A83; color: #fff; font-weight: 600; text-align: left; }
  tr:nth-child(even) td { background: #EEF2F5; }
  td button, td input[type=submit] { padding: 3px 10px; font-size: 13px; }
  .error, [style*="color: red"], [style*="color:red"] { color: #B4423F; }
</style>
</head>
<body>
  <h1>社員管理</h1>

  <form id="searchForm" method="get" th:action="@{/employees}">
    <label for="keyword">キーワード</label>
    <input id="keyword" name="keyword" type="text" th:value="${keyword}" />
    <label for="departmentId">部署</label>
    <select id="departmentId" name="departmentId">
      <option value="">すべて</option>
      <option th:each="department : ${departments}" th:value="${department.departmentId}"
              th:text="${department.departmentName}"
              th:selected="${department.departmentId == departmentId}">部署</option>
    </select>
    <label for="jobId">役職</label>
    <select id="jobId" name="jobId">
      <option value="">すべて</option>
      <option th:each="job : ${jobs}" th:value="${job.jobId}"
              th:text="${job.jobName}" th:selected="${job.jobId == jobId}">役職</option>
    </select>
    <label for="salaryFrom">月給（下限）</label>
    <input id="salaryFrom" name="salaryFrom" type="text" th:value="${salaryFrom}" />
    <label for="salaryTo">月給（上限）</label>
    <input id="salaryTo" name="salaryTo" type="text" th:value="${salaryTo}" />
    <button id="search" type="submit" name="page" value="1">検索</button>
    <button id="prev" type="submit" name="page" th:value="${page - 1}"
            th:disabled="${!hasPrev}">前へ</button>
    <button id="next" type="submit" name="page" th:value="${page + 1}"
            th:disabled="${!hasNext}">次へ</button>
  </form>

  <form method="get" th:action="@{/employees/new}">
    <button id="new" type="submit">新規登録</button>
  </form>

  <p class="empty" th:if="${#lists.isEmpty(employees)}">該当する社員はいません</p>
  <table border="1" cellspacing="0" cellpadding="4" id="employees" th:unless="${#lists.isEmpty(employees)}">
    <tr>
      <th>氏名</th><th>部署</th><th>役職</th><th>月給</th><th>入社日</th><th></th>
    </tr>
    <!-- 部署・役職は @ManyToOne の関連をたどって表示する（部署なしの社員は department が null） -->
    <tr th:each="employee : ${employees}">
      <td th:text="${employee.employeeName}">氏名</td>
      <td th:text="${employee.department?.departmentName}">部署</td>
      <td th:text="${employee.job.jobName}">役職</td>
      <td th:text="${#numbers.formatInteger(employee.salary, 1, 'COMMA')} + '円'">月給</td>
      <td th:text="${employee.entranceDate}">入社日</td>
      <td>
        <form method="get" th:action="@{|/employees/${employee.employeeId}/edit|}"
              style="display:inline">
          <button class="edit" type="submit">編集</button>
        </form>
        <form method="post" th:action="@{|/employees/${employee.employeeId}/delete|}"
              style="display:inline">
          <button class="delete" type="submit">削除</button>
        </form>
      </td>
    </tr>
  </table>

  <p id="paging" th:text="|${page}/${totalPages}ページ（${totalCount}件）|">
    1/1ページ（0件）
  </p>
  <p class="error" th:each="message : ${errors}" th:text="${message}">エラー</p>
</body>
</html>
