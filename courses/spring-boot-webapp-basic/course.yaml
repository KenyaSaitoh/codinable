    lesson: '10.1 Springのトランザクション管理と伝播'
    runtime: spring
    run: 'gradle:bootRun'
    suggestName: spring-mvc-tx-jta
    names:
      ja: JTA で 2 つのデータソースを 1 つのトランザクションにする
      en: One JTA transaction across two data sources
    descriptions:
      ja: >-
        Atomikos に登録した 2 つの XA データソースを BarBean と QuxBean が使い分け、
        FooBean のグローバルトランザクションに参加します。bootRun で起動し、
        http://localhost:8080/JtaPage.html から 100 と -5 を送って、応答と実行ログを確かめてください。
      en: >-
        BarBean and QuxBean each use one of two XA data sources registered with Atomikos and join
        FooBean's global transaction. Start it with bootRun, send 100 and -5 from
        http://localhost:8080/JtaPage.html, and check the responses and the log.
