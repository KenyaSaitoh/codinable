    lesson: '10.1 Springのトランザクション管理と伝播'
    runtime: spring
    run: 'gradle:bootRun'
    suggestName: spring-mvc-tx
    names:
      ja: REQUIRED と REQUIRES_NEW の伝播
      en: REQUIRED vs REQUIRES_NEW propagation
    descriptions:
      ja: >-
        FooBean（REQUIRED）が BarBean（REQUIRES_NEW）と QuxBean（REQUIRED）を呼び、
        QuxBean は引数が負なら例外を送出します。bootRun で起動し、
        http://localhost:8080/fuga?param=100 と ?param=-5 を開いて、応答と実行ログの流れを確かめてください。
      en: >-
        FooBean (REQUIRED) calls BarBean (REQUIRES_NEW) and QuxBean (REQUIRED); QuxBean throws when
        the argument is negative. Start it with bootRun, open http://localhost:8080/fuga?param=100 and
        ?param=-5, and follow the responses and the log.
    openFiles:
