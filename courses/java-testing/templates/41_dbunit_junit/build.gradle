// 41_dbunit_junit: DBUnit と Mockito を組み合わせたテスト（チャプター4.1）
// DB はインメモリの HSQLDB。テーブルはテスト開始時に src/test/resources/schema.sql から作る（SchemaInitializer）
plugins {
    id "java"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach { options.encoding = "UTF-8" }

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.slf4j:slf4j-api:2.0.17"
    runtimeOnly "org.slf4j:slf4j-simple:2.0.17"
    testImplementation platform("org.junit:junit-bom:6.1.3")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // SchemaInitializer をコンパイルするためだけに使う
    testCompileOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.mockito:mockito-core:5.24.0"
    testImplementation "org.mockito:mockito-junit-jupiter:5.24.0"
    testImplementation "org.dbunit:dbunit:3.5.2"
    runtimeOnly "org.hsqldb:hsqldb:2.7.4"
}

test {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true
        events "passed", "failed", "skipped"
        exceptionFormat = "full"
    }
}

// JDK 24 以降は Mockito が実行中に自分自身をエージェントとして読み込めない
// mockito-core を -javaagent で渡す（Codinable の同梱ランタイムでもモックを作れるようにするため）
configurations {
    mockitoAgent
}

dependencies {
    mockitoAgent("org.mockito:mockito-core:5.24.0") {
        transitive = false
    }
}

tasks.withType(Test).configureEach {
    jvmArgumentProviders.add({ ["-javaagent:${configurations.mockitoAgent.singleFile}"] } as CommandLineArgumentProvider)
}
