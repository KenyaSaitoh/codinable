// 71_selenide: Selenium / Selenide による Web ブラウザの UI テスト（チャプター7.1）
// テスト対象の spring-bookstore-mvc（8080）と spring-bookstore-rest（8081）はサブフォルダーの独立したプロジェクト
// アプリ実行で 2 つを起動してから、BookStoreTest を開いて ファイル実行する
// ドライバーと（Chrome が無ければ）Chrome for Testing は Selenium Manager が初回に用意する
plugins {
    id "java"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach { options.encoding = "UTF-8" }

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform("org.junit:junit-bom:6.1.3")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "com.codeborne:selenide:7.19.1"
    testImplementation "org.seleniumhq.selenium:selenium-java:4.52.0"
    testRuntimeOnly "org.slf4j:slf4j-simple:2.0.17"
}

test {
    useJUnitPlatform()
    // 画面の操作に時間がかかるので、1 操作ごとの結果が見えるようにする
    testLogging {
        showStandardStreams = true
        events "passed", "failed", "skipped"
        exceptionFormat = "full"
    }
}

// アプリ実行で動くタスク。codinable.services.json の processes が
// テスト対象の Spring Boot アプリを起動するので、ここではポートが開くまで待って案内を出す
def waitForPorts = { Map<String, Integer> apps ->
    long limit = System.currentTimeMillis() + 10 * 60 * 1000
    apps.each { name, port ->
        boolean ready = false
        while (!ready) {
            try {
                new Socket("localhost", port).close()
                ready = true
            } catch (IOException ignored) {
                if (System.currentTimeMillis() > limit) {
                    throw new GradleException("${name} が起動しません（ポート ${port}）。実行結果の [${name}] の行を確かめてください")
                }
                sleep(1000)
            }
        }
        println "${name} が起動しました（ポート ${port}）"
    }
    println "起動したまま、テストクラスを開いてエディタの右上の ファイル実行を押してください"
}

tasks.register("waitForApps") {
    doLast { waitForPorts(["spring-bookstore-rest": 8081, "spring-bookstore-mvc": 8080]) }
}
