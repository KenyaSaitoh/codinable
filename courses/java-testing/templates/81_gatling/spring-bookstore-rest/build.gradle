// spring-bookstore-rest: テスト対象の Spring Boot アプリケーション（ポート 8081）
// テストのプロジェクト（1 つ上のフォルダー）の codinable.services.json から、▶ アプリ実行のときに一緒に起動する
// 顧客情報を提供する REST API。ログインのときに spring-bookstore-mvc から呼ばれる
plugins {
    id "java"
    id "org.springframework.boot" version "4.1.2"
    id "io.spring.dependency-management" version "1.1.7"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach { options.encoding = "UTF-8" }

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot 4 では spring-boot-starter-web は spring-boot-starter-webmvc に改名された
    implementation "org.springframework.boot:spring-boot-starter-webmvc"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    runtimeOnly "org.hsqldb:hsqldb:2.7.4"
}

processResources {
    from("sql/hsqldb") {
        include "2_*.sql", "3_*.sql"
        into "db"
    }
}
