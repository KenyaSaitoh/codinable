// ═══════════════════════════════════════════════════════════
//  21_junit: JUnit 6 による単体テスト（チャプター2.1、2.3）
//  テストクラスを開いて、エディタの右上の ファイル実行で流す
// ═══════════════════════════════════════════════════════════
plugins {
    id "java"
    id "jacoco"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach { options.encoding = "UTF-8" }

repositories {
    mavenCentral()
}

def junitVer = "6.1.3"

dependencies {
    // calc.sideeffect.OutputCalc のログ出力
    implementation "org.slf4j:slf4j-api:2.0.17"
    runtimeOnly "org.slf4j:slf4j-simple:2.0.17"
    testImplementation platform("org.junit:junit-bom:${junitVer}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    // @Suite（テストスイート。calc.suite.CalcTestSuite）
    testImplementation "org.junit.platform:junit-platform-suite"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform {
        // 実行時間が揺れる TimeoutTest など、excludeFromBuild タグのクラスをビルドテストから除く
        excludeTags "excludeFromBuild"
    }
    testLogging {
        showStandardStreams = true
        events "passed", "failed", "skipped"
        exceptionFormat = "full"
    }
    // "IT"で始まるテストクラスは結合テスト扱いで、下の integrationTest で流す
    exclude "**/IT*.class"
    finalizedBy jacocoTestReport
}

// "IT"で始まるテストクラスだけを流すタスク
tasks.register("integrationTest", Test) {
    group = "verification"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include "**/IT*.class"
}

jacoco {
    toolVersion = "0.8.16"
}

jacocoTestReport {
    reports {
        xml.required.set(true)
    }
}

// Codinable の ファイル実行は test --tests <クラス> で 1 クラスだけを流す
// 開いたクラスが必ず動くように、1 クラス指定のときだけ上の除外（IT*、excludeFromBuild）を外す
// ./gradlew test のように全体を流すビルドテストの動きは変わらない
if (gradle.startParameter.taskRequests.any { it.args.contains("--tests") }) {
    tasks.named("test", Test) {
        setExcludes([])
        options { excludeTags.clear() }
    }
}
