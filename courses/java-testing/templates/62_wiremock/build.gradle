// 62_wiremock: WireMock によるモックサーバーの構築（チャプター6.2）
// モックサーバーの WireMockApp は main を持つので、開いてエディタの右上の ▶ 実行で動かす
plugins {
    id "java"
    id "application"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach { options.encoding = "UTF-8" }

repositories {
    mavenCentral()
}

sourceSets {
    personApiTest
}

dependencies {
    // WireMock 3 からグループ ID が org.wiremock になった
    implementation "org.wiremock:wiremock:3.13.2"
    // チャプター6.1 の PersonApiTest をモックサーバーに向けて流すためのもの（scripts/01_person_api_test.sh）
    personApiTestImplementation platform("org.junit:junit-bom:6.1.3")
    personApiTestImplementation "org.junit.jupiter:junit-jupiter"
    personApiTestRuntimeOnly "org.junit.platform:junit-platform-launcher"
    personApiTestImplementation "io.rest-assured:rest-assured:6.3.0"
    personApiTestImplementation "com.fasterxml.jackson.core:jackson-databind:2.20.0"
}

// ▶ 実行は run -PmainClass=<開いている WireMockApp> で動かす
application {
    mainClass = project.hasProperty("mainClass") ? project.property("mainClass") : "pro.kensait.spring.calc.rest.test1.WireMockApp"
}

tasks.register("personApiTest", Test) {
    testClassesDirs = sourceSets.personApiTest.output.classesDirs
    classpath = sourceSets.personApiTest.runtimeClasspath
    useJUnitPlatform()
    // モックサーバーが相手なので、毎回流す
    outputs.upToDateWhen { false }
    testLogging {
        showStandardStreams = true
        events "passed", "failed", "skipped"
        exceptionFormat = "full"
    }
}
