# ═══════════════════════════════════════════════════════════
#  Udemy「Javaテスト基礎＆実践」の演習
#
#  雛形のフォルダー名は原稿の出典行のプロジェクト名（21_junit、31_mockito など）と同じにしてある
#  テスト対象の Spring Boot アプリ（spring-rest-*、spring-bookstore-*）は、テストのプロジェクトのサブフォルダーに置き、
#  アプリ実行のときに codinable.services.json の processes で起動する
#  run の gradle:waitFor* は、そのアプリのポートが開くまで待って案内を出すだけのタスク
#  Docker が要る演習（Testcontainers）と PIT は置かない
#
#  exercises[] の項目は courses/webapp-archi-overview/course.yaml のコメントを参照
# ═══════════════════════════════════════════════════════════
id: java-testing
order: 23
# 同じ id の講座が複数の置き場にあるときは、この version が新しいほうが使われる
version: 1.0.0

names:
  ja: Javaテスト基礎＆実践
  en: Java Testing Fundamentals and Practice

descriptions:
  ja: >-
    JUnit と Mockito による単体テスト、DBUnit と Database Rider によるデータベーステスト、Spring Boot Test、
    RestAssured と WireMock による REST API のテスト、Selenium（Selenide）と Playwright による UI テスト、
    Gatling による負荷テストを、AI が書いたテストを人が確かめる視点で扱う講座の演習です。
    テストクラスを開いてエディタの右上の ファイル実行で流し、テスト結果とカバレッジを確かめます。
    テスト対象のアプリが要る演習は、先に アプリ実行で起動します。
  en: >-
    Exercises for the course on unit tests with JUnit and Mockito, database tests with DBUnit and Database Rider,
    Spring Boot Test, REST API tests with RestAssured and WireMock, UI tests with Selenium (Selenide) and Playwright,
    and load tests with Gatling, from the viewpoint of people verifying tests written by AI.
    Open a test class and press Run file at the top right of the editor to see the results and coverage.
    Exercises that need an application under test start it first with Run app.

# チャプター名（演習一覧の見出し）
chapters:
  '1.3':
    ja: 'ソフトウェアテストの概要'
    en: 'Software Testing Overview'
  '1.4':
    ja: '単体テストの手法と戦略'
    en: 'Unit Testing Techniques and Strategy'
  '2.1':
    ja: 'JUnitによる単体テスト'
    en: 'Unit Testing with JUnit'
  '2.2':
    ja: '単体テストにおける依存性注入とテストダブル'
    en: 'Dependency Injection and Test Doubles in Unit Tests'
  '2.3':
    ja: 'Gradleによるテスト実行とカバレッジ'
    en: 'Running Tests and Measuring Coverage with Gradle'
  '3.1':
    ja: 'Mockitoによるモッキング'
    en: 'Mocking with Mockito'
  '4.1':
    ja: 'DBUnitによるデータベーステスト'
    en: 'Database Testing with DBUnit'
  '4.2':
    ja: 'Database Riderによる宣言的なデータベーステスト'
    en: 'Declarative Database Testing with Database Rider'
  '5.1':
    ja: 'Spring Bootアプリケーションの単体テスト'
    en: 'Unit Testing Spring Boot Applications'
  '6.1':
    ja: 'RestAssuredによるREST APIのテスト'
    en: 'Testing REST APIs with RestAssured'
  '6.2':
    ja: 'WireMockによるモックサーバー構築'
    en: 'Building Mock Servers with WireMock'
  '7.1':
    ja: 'SeleniumとSelenideによるWebブラウザのUIテスト'
    en: 'Web Browser UI Testing with Selenium and Selenide'
  '7.2':
    ja: 'PlaywrightによるWebブラウザのUIテスト'
    en: 'Web Browser UI Testing with Playwright'
  '8.1':
    ja: 'Gatlingによる負荷テスト'
    en: 'Load Testing with Gatling'
  '10.1':
    ja: 'AIが書いたコードとテストを人が担保する仕組み'
    en: 'How People Assure AI-Written Code and Tests'

exercises:
  - id: fee-branch
    dir: 21_junit
    chapter: '1.3'
    lesson: '1.3.3 テストケースの作成とテスト技法'
    runtime: java
    run: 'gradle:test'
    suggestName: fee-branch
    names:
      ja: '分岐を読んで配送料のテストを考える'
      en: 'Reading branches for delivery fee tests'
    descriptions:
      ja: >-
        CustomerService2 の配送料の分岐と、CustomerService2Test を読みます。CustomerService2Test.java を開いて、エディタの右上の ファイル実行で流してください。命令網羅・分岐網羅・条件網羅のどれを満たすかを確かめてください。
      en: >-
        Read the branches of CustomerService2 and CustomerService2Test. Open CustomerService2Test.java and press Run file at the top right of the editor. Check which coverage criteria it meets.
    openFiles:
      - README.md

  - id: special-calculator
    dir: 21_junit
    chapter: '1.3'
    lesson: '1.3.4 「特殊電卓」でテスト観点を作る'
    runtime: java
    run: 'gradle:test'
    suggestName: special-calculator
    names:
      ja: '「特殊電卓」でテスト観点を作る'
      en: 'Test viewpoints for the special calculator'
    descriptions:
      ja: >-
        仕様どおりに例外を送出する SpecialCalculator を読み、テスト観点の表から AI に SpecialCalculatorTest を書かせます。できたテストを開いて、エディタの右上の ファイル実行で流してください。
      en: >-
        Read SpecialCalculator and have the AI write SpecialCalculatorTest from the viewpoint table. Open the new test and press Run file at the top right of the editor.
    openFiles:
      - README.md

  - id: verify-state
    dir: 21_junit
    chapter: '1.4'
    lesson: '1.4.5 単体テストにおける検証パターン'
    runtime: java
    run: 'gradle:test'
    suggestName: verify-state
    names:
      ja: '戻り値のないメソッドを状態で検証する'
      en: 'State-based verification'
    descriptions:
      ja: >-
        StatefulCalcTest.java を開いて、エディタの右上の ファイル実行で流してください。戻り値のない add() の結果を getAnswer() で取り出して比べています。
      en: >-
        Open StatefulCalcTest.java and press Run file at the top right of the editor. The result of add(), which returns nothing, is read with getAnswer().
    openFiles:
      - README.md

  - id: verify-behavior
    dir: 31_mockito
    chapter: '1.4'
    lesson: '1.4.5 単体テストにおける検証パターン'
    runtime: java
    run: 'gradle:test'
    suggestName: verify-behavior
    names:
      ja: '呼び出しの回数を検証する'
      en: 'Behavior verification with a mock'
    descriptions:
      ja: >-
        mock/verify/VerifyTest.java を開いて、エディタの右上の ファイル実行で流してください。MapUtil が Map の get() を呼んだ回数を verify() で確かめています。
      en: >-
        Open mock/verify/VerifyTest.java and press Run file at the top right of the editor. verify() checks how many times MapUtil called get() on the map.
    openFiles:
      - README.md

