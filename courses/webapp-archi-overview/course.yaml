    names:
      ja: Fetch処理をカスタムフックへ分離する
      en: Extract Fetch logic into a custom hook
    descriptions:
      ja: >-
        useEffect からローカルの JSON を取得し、loading / error / data を State で管理します。
        取得処理を useUsers に分離し、表示コンポーネントから再利用する構成です。
