# ═══════════════════════════════════════════════════════════
#  Udemy「Java Advanced」の演習
#
#  講座の原稿の出典行（03_thread_concurrent: pro.kensait...Main）のフォルダーを、そのまま 1 つずつの
#  Gradle プロジェクトにして templates/ に置いている。1 つのプロジェクトを複数のレッスンの演習で使う
#  run の -PmainClass がレッスンごとに最初に動かす main。ほかの main はファイルを開いて ファイル実行で動かす
#  06_network_io はサーバーを codinable.services.json の processes で一緒に起動する
# ═══════════════════════════════════════════════════════════
id: java-advanced
order: 22
# 同じ id の講座が複数の置き場にあるときは、この version が新しいほうが使われる
version: 1.0.0

names:
  ja: Java Advanced
  en: Java Advanced

descriptions:
  ja: >-
    モジュール、スレッドと並行処理、ラムダ式とストリーム、入出力、総称型、リフレクション、アノテーション、レコードの仕組みを、
    短いコードを動かして確かめる講座の演習です。どの演習も Java のコンソールプログラムで、main を持つクラスを開いて
    エディタの右上の ファイル実行で動かします。サーバーとクライアントの演習は、クライアントの ファイル実行でサーバーも一緒に起動します。
  en: >-
    Exercises for the course that checks, by running short programs, how modules, threads and concurrency, lambdas and
    streams, I/O, generics, reflection, annotations and records work. Every exercise is a Java console program: open a class
    with a main method and press Run file at the top right of the editor. In the server and client exercises, running a client
    also starts its server.

# チャプター名（演習一覧の見出し。原稿 1.1 の構成表のチャプターを並べている）
chapters:
  '2.1':
    ja: 'モジュールシステムの構造'
    en: 'The Structure of the Module System'
  '3.1':
    ja: 'スレッドの仕組みとスレッドセーフ'
    en: 'Threads and Thread Safety'
  '3.2':
    ja: 'Executorフレームワークと非同期タスク'
    en: 'The Executor Framework and Asynchronous Tasks'
  '3.3':
    ja: '同期化支援と並行コレクション'
    en: 'Synchronizers and Concurrent Collections'
  '4.1':
    ja: 'ラムダ式と関数型インタフェースの仕組み'
    en: 'Lambdas and Functional Interfaces'
  '4.2':
    ja: 'ストリームのパイプラインの構造'
    en: 'The Structure of Stream Pipelines'
  '5.1':
    ja: 'ファイル入出力の仕組み'
    en: 'File I/O'
  '5.2':
    ja: 'バイト配列ストリームとシリアライズ'
    en: 'Byte Array Streams and Serialization'
  '6.1':
    ja: 'TCPとUDPによるネットワーク'
    en: 'Networking with TCP and UDP'
  '6.2':
    ja: 'HTTPによるアプリケーション連携'
    en: 'Application Integration over HTTP'
  '7.1':
    ja: '総称型の仕組み'
    en: 'How Generics Work'
  '8.1':
    ja: 'クラスローダーの仕組みとClassクラス'
    en: 'Class Loaders and the Class Class'
  '8.2':
    ja: 'リフレクションの仕組みとAPI'
    en: 'Reflection'
  '8.3':
    ja: 'アノテーションの仕組みとAPI'
    en: 'Annotations'
  '9.1':
    ja: 'レコードによる不変のデータの設計'
    en: 'Designing Immutable Data with Records'

exercises:
  # ── チャプター2 ─────────────────────────────
  - id: module-access
    dir: 02_jar_module
    chapter: '2.1'
    lesson: '2.1.2 依存・公開・読み取り可能性'
    runtime: java
    run: 'gradle:run'
    suggestName: module-access
    names:
      ja: 'requires・exports とモジュール間のアクセス'
      en: 'requires, exports and access between modules'
    descriptions:
      ja: >-
        2 つの module-info.java と Application を読み、アプリ実行で hoge モジュールを動かして 13 が表示されることを見ます。Application のコメントを外すと、Common が exports されていないためコンパイルエラーになります。
      en: >-
        Read the two module-info.java files and Application, then press Run app to run the hoge module and see 13. Uncommenting the Common call gives a compile error because its package is not exported.
    openFiles:
      - README.md

  # ── チャプター3 ─────────────────────────────
  - id: thread-memory
    dir: 03_thread_concurrent
    chapter: '3.1'
    lesson: '3.1.1 スレッドとメモリーの関係'
    runtime: java
    run: 'gradle:run -PmainClass=pro.kensait.java.advanced.lsn_3_1_1.runnable.Main_Lambda'
    suggestName: thread-memory
    names:
      ja: 'スレッドの作成と start()'
      en: 'Creating threads and start()'
    descriptions:
      ja: >-
        アプリ実行で lsn_3_1_1.runnable.Main_Lambda を動かし、[ Main ] finish が先に表示された後でタスクの合計値が表示されることを見ます。thread.Main も同じように動かせます。
      en: >-
        Press Run app to run lsn_3_1_1.runnable.Main_Lambda: [ Main ] finish appears first and the task total later. thread.Main works the same way.
    openFiles:
      - README.md

  - id: thread-join
    dir: 03_thread_concurrent
    chapter: '3.1'
    lesson: '3.1.2 スレッドの状態と待ち合わせ・割り込み'
    runtime: java
    run: 'gradle:run -PmainClass=pro.kensait.java.advanced.lsn_3_1_1.join.Main'
    suggestName: thread-join
    names:
      ja: 'join() による待ち合わせ'
      en: 'Waiting with join()'
    descriptions:
      ja: >-
        アプリ実行で lsn_3_1_1.join.Main を動かし、t2（5 秒）と t1（8 秒）が終わってからメインスレッド終了が表示されることを見ます。
      en: >-
        Press Run app to run lsn_3_1_1.join.Main: the main thread finishes only after t2 (5 s) and t1 (8 s).
    openFiles:
      - README.md

  - id: thread-race
    dir: 03_thread_concurrent
    chapter: '3.1'
    lesson: '3.1.3 競合状態・可視性と同期化'
    runtime: java
    run: 'gradle:run -PmainClass=pro.kensait.java.advanced.lsn_3_1_2.unsafe.Main'
    suggestName: thread-race
    names:
      ja: '競合状態と synchronized'
      en: 'Race conditions and synchronized'
    descriptions:
      ja: >-
        アプリ実行で lsn_3_1_2.unsafe.Main を何度か動かし、最終的な値が 30 にならず毎回変わることを見ます。safe.Main を開いてファイル実行すると常に 30 になります。
      en: >-
        Press Run app a few times to run lsn_3_1_2.unsafe.Main: the final value changes and misses 30. Open safe.Main and press Run file: it is always 30.
    openFiles:
      - README.md

  - id: thread-deadlock-lock
    dir: 03_thread_concurrent
    chapter: '3.1'
    lesson: '3.1.4 デッドロックと明示的なロック'
    runtime: java
    run: 'gradle:run -PmainClass=pro.kensait.java.advanced.lsn_3_1_2.readwritelock.Main'
    suggestName: thread-deadlock-lock
    names:
      ja: 'デッドロックと ReentrantReadWriteLock'
      en: 'Deadlock and ReentrantReadWriteLock'
    descriptions:
      ja: >-
        アプリ実行で lsn_3_1_2.readwritelock.Main を動かし、最終的な値が 30 になることを見ます。deadlock.Main は開いてファイル実行し、出力が止まったら出力欄の「停止」で終わらせます。
      en: >-
        Press Run app to run lsn_3_1_2.readwritelock.Main and see 30. Open deadlock.Main, press Run file, and press Stop in the output pane once the output freezes.
    openFiles:
      - README.md

  - id: thread-wait-notify
    dir: 03_thread_concurrent
    chapter: '3.1'
    lesson: '3.1.5 wait()とnotify()によるスレッド間通信'
    runtime: java
    run: 'gradle:run -PmainClass=pro.kensait.java.advanced.lsn_3_1_3.Main'
    suggestName: thread-wait-notify
    names:
      ja: 'wait() と notify()'
      en: 'wait() and notify()'
    descriptions:
      ja: >-
        アプリ実行で lsn_3_1_3.Main を動かし、BarThread の 5 秒の計算の後で FooThread が 12345 を受け取ることを見ます。
      en: >-
        Press Run app to run lsn_3_1_3.Main: FooThread receives 12345 after the 5-second calculation in BarThread.
    openFiles:
      - README.md

  - id: thread-immutable-local
    dir: 03_thread_concurrent
    chapter: '3.1'
    lesson: '3.1.6 共有しない設計：イミュータブルとスレッドローカル'
    runtime: java
    run: 'gradle:run -PmainClass=pro.kensait.java.advanced.lsn_3_1_4.Main'
    suggestName: thread-immutable-local
    names:
      ja: 'イミュータブルとスレッドローカル'
      en: 'Immutability and thread-local values'
    descriptions:
      ja: >-
        アプリ実行で lsn_3_1_4.Main を動かし、引数で渡していない "Alice" を Foo#process() が取り出すことを見ます。lsn_3_1_2.immutable.Main を開いてファイル実行すると、両方のスレッドが foo!!!!!!!!!! になります。
      en: >-
        Press Run app to run lsn_3_1_4.Main: Foo#process() gets "Alice" without an argument. Open lsn_3_1_2.immutable.Main and press Run file: both threads end with foo!!!!!!!!!!.
    openFiles:
      - README.md

  - id: executor-pool
    dir: 03_thread_concurrent
    chapter: '3.2'
    lesson: '3.2.2 スレッドプールの種類と選び方'
    runtime: java
    run: 'gradle:run -PmainClass=pro.kensait.java.advanced.lsn_3_2_2.Main_Cached'
    suggestName: executor-pool
    names:
      ja: 'スレッドプールの種類'
      en: 'Kinds of thread pools'
    descriptions:
      ja: >-
        アプリ実行で lsn_3_2_2.Main_Cached を動かし、3 つのタスクが並列に動くことを見ます。Main_Single と Main_Fixed は開いてファイル実行します。shutdown しないのでプログラムは終わらず、出力欄の「停止」で終わらせます。
      en: >-
        Press Run app to run lsn_3_2_2.Main_Cached and see three tasks in parallel. Open Main_Single and Main_Fixed and press Run file; they never shut down, so press Stop in the output pane.
    openFiles:
      - README.md

  - id: executor-shutdown
    dir: 03_thread_concurrent
    chapter: '3.2'
    lesson: '3.2.3 ExecutorServiceのシャットダウン'
    runtime: java
    run: 'gradle:run -PmainClass=pro.kensait.java.advanced.lsn_3_2_2.Main_Await'
    suggestName: executor-shutdown
    names:
      ja: 'shutdown と awaitTermination'
      en: 'shutdown and awaitTermination'
    descriptions:
      ja: >-
        アプリ実行で lsn_3_2_2.Main_Await を動かし、12 秒待っても終わらないタスクが shutdownNow() で割り込まれる流れを出力で見ます。
      en: >-
        Press Run app to run lsn_3_2_2.Main_Await and follow in the output how a task still running after 12 seconds is interrupted by shutdownNow().
    openFiles:
      - README.md

  - id: executor-schedule
    dir: 03_thread_concurrent
    chapter: '3.2'
    lesson: '3.2.4 ScheduledExecutorServiceによる定期実行'
    runtime: java
    run: 'gradle:run -PmainClass=pro.kensait.java.advanced.lsn_3_2_3.Main_Schedule'
    suggestName: executor-schedule
    names:
      ja: '遅延実行と定期実行'
      en: 'Delayed and periodic execution'
    descriptions:
      ja: >-
        アプリ実行で lsn_3_2_3.Main_Schedule を動かします。Main_FixedRate と Main_FixedDelay は開いてファイル実行し、繰り返しの間隔を見比べてから出力欄の「停止」で終わらせます。
      en: >-
        Press Run app to run lsn_3_2_3.Main_Schedule. Open Main_FixedRate and Main_FixedDelay, press Run file, compare the intervals, then press Stop in the output pane.
    openFiles:
      - README.md

  - id: executor-future
    dir: 03_thread_concurrent
    chapter: '3.2'
    lesson: '3.2.5 FutureとCallableによる結果と例外の受け取り'
    runtime: java
    run: 'gradle:run -PmainClass=pro.kensait.java.advanced.lsn_3_2_4.callable.Main_Get_3'
    suggestName: executor-future
    names:
      ja: 'Future と Callable'
      en: 'Future and Callable'
    descriptions:
      ja: >-
        アプリ実行で lsn_3_2_4.callable.Main_Get_3 を動かし、get() で結果を受け取る時点を見ます。Main_Timeout と exception.Main は開いてファイル実行します。
      en: >-
        Press Run app to run lsn_3_2_4.callable.Main_Get_3 and see when get() returns. Open Main_Timeout and exception.Main and press Run file.
    openFiles:
      - README.md

  - id: executor-invokeall
    dir: 03_thread_concurrent
    chapter: '3.2'
    lesson: '3.2.6 複数タスクの一括実行と分割処理'
    runtime: java
    run: 'gradle:run -PmainClass=pro.kensait.java.advanced.lsn_3_2_5.invokeall.Main'
    suggestName: executor-invokeall
    names:
      ja: 'invokeAll と分割処理'
      en: 'invokeAll and splitting work'
    descriptions:
      ja: >-
        アプリ実行で lsn_3_2_5.invokeall.Main を動かし、約 15 秒後に結果がまとめて表示されることを見ます。collection.Main を開いてファイル実行すると合計値 5000050000 が表示されます。
      en: >-
        Press Run app to run lsn_3_2_5.invokeall.Main: all results appear together after about 15 seconds. Open collection.Main and press Run file to see the total 5000050000.
    openFiles:
      - README.md

  - id: sync-latch-barrier
    dir: 03_thread_concurrent
    chapter: '3.3'
    lesson: '3.3.1 同期化支援のCountDownLatchとCyclicBarrier'
    runtime: java
    run: 'gradle:run -PmainClass=pro.kensait.java.advanced.lsn_3_3_1.countdownlatch.Main'
    suggestName: sync-latch-barrier
    names:
      ja: 'CountDownLatch と CyclicBarrier'
      en: 'CountDownLatch and CyclicBarrier'
    descriptions:
      ja: >-
        アプリ実行で lsn_3_3_1.countdownlatch.Main を動かし、Worker が開始の合図を待ち、メインスレッドが全員の終了を待つ流れを見ます。cyclicbarrier.Main は開いてファイル実行します。
      en: >-
        Press Run app to run lsn_3_3_1.countdownlatch.Main: the Workers wait for the start signal and main waits for them all. Open cyclicbarrier.Main and press Run file.
    openFiles:
      - README.md

