name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Run unit and integration tests
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          for project in junit-shipping mockito-shipping spring-test-employee database-rider-employee api-test-employee playwright-employee gatling-employee pipeline-employee; do
            bash harness/bin/gate.sh backend "master:$project"
          done
          ./gradlew :master:pipeline-employee:coverageReport --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: |
            projects/master/**/build/reports/
            harness/out/

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Run Playwright E2E test
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew :master:playwright-employee:e2eTest --no-daemon
      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            projects/master/06_playwright/playwright-employee/webapp/build/reports/tests/e2eTest/
            projects/master/06_playwright/playwright-employee/webapp/build/reports/playwright/
