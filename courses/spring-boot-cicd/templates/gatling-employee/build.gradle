// 第7章：Gatling で社員管理 Web アプリに HTTP 負荷をかけ、応答内容（checks）と
// 件数・失敗・p95（assertions）を検証する
// 元のサンプルは親 build.gradle と gradle/employee-app.gradle に設定を分けたマルチプロジェクト
// だった。Codinable では単独で動く必要があるため 1 ファイルに畳んでいる
//
// Codinable の実行対象に出る Gradle タスクは bootRun / test / build / bootJar だけで、
// gatlingRun は選べない。そこで次の 2 段で動かす
//   1. 実行対象「bootRun」で負荷を受けるアプリを http://localhost:8080 に起動する
//   2. ターミナルで gradlew.bat gatlingRun を実行する（接続先の既定は http://localhost:8080）
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'io.gatling.gradle' version '3.15.1.2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // Spring Boot 4 では spring-boot-starter-web は spring-boot-starter-webmvc に改名された
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // DB は組み込みの H2（インメモリ）。起動のたびに schema.sql / data.sql で初期化される
    runtimeOnly 'com.h2database:h2'
    // EmployeeController の @SuppressFBWarnings（SpotBugs の抑止指定）をコンパイルするためだけに使う
    // SpotBugs 自体は動かさない
    compileOnly 'com.github.spotbugs:spotbugs-annotations:4.8.3'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 負荷をかける前の結合テストでも、同じ CSV とアプリの初期データの対応を確かめる
tasks.named('processTestResources') {
    from('src/gatling/resources') {
        include 'employees.csv'
    }
}

// 元のサンプルは test から @Tag("it") を除外し、別タスク integrationTest で流していた
// この章のテスト（EmployeeApplicationSmokeTest）は @Tag("it") なので、Codinable の
// 「test」ボタンで走るよう除外タグを外している（アプリと H2 はテストが自動で起動する）
test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

gatling {
    gatlingVersion = '3.15.1'
    // JDK 25 で Gatling を動かすための起動オプション
    jvmArgs = [
        '-Dfile.encoding=UTF-8',
        '--add-opens=java.base/java.lang=ALL-UNNAMED',
        '--enable-native-access=ALL-UNNAMED'
    ]
    // 接続先は環境変数 GATLING_BASE_URL で変えられる（既定は bootRun のアプリ）
    systemProperties = [
        'baseUrl': System.getenv('GATLING_BASE_URL') ?: 'http://localhost:8080'
    ]
}
