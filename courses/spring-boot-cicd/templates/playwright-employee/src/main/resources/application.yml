spring:
  application:
    name: employee-app
  datasource:
    generate-unique-name: true
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: always
  thymeleaf:
    cache: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  shutdown: graceful
