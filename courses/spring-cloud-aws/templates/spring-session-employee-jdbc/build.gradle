// 社員管理システム（MVC）+ Spring Session（JDBC 版）
// 講座リポジトリではマルチプロジェクトの 1 つだったものを、単独で動く形に畳んである
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot 4 では spring-boot-starter-web は spring-boot-starter-webmvc に改名された
    implementation "org.springframework.boot:spring-boot-starter-webmvc"
    implementation "org.springframework.boot:spring-boot-starter-thymeleaf"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    // Boot 4 では Session の自動構成を含むスターターを使用する（@EnableJdbcHttpSession は不要）
    implementation "org.springframework.boot:spring-boot-starter-session-jdbc"
    // 社員用 RDB のドライバ。Codinable では HSQLDB、Aurora へ接続するときは PostgreSQL を使う
    // ソースの @SuppressFBWarnings（SpotBugs の抑止注釈）をコンパイルするためだけに使う
    compileOnly "com.github.spotbugs:spotbugs-annotations:4.8.3"
    runtimeOnly "org.hsqldb:hsqldb"
    runtimeOnly "org.postgresql:postgresql"
    testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// テストは MockMvc（standaloneSetup）で画面遷移とセッション属性を確かめるもので、
// DB やセッションの保存先には接続しない
test {
    useJUnitPlatform()
    testLogging {
        events "passed", "failed", "skipped"
        exceptionFormat "full"
    }
}

// JDK 21 以降は実行中のエージェント読み込みが制限され、JDK 25 では Mockito が
// 自分自身をアタッチできずにモックの生成に失敗する。mockito-core を -javaagent で渡しておく
// （バージョンは Spring Boot の BOM が管理する。Codinable の「test」も同じ指定を自動で足すが、
//   build やターミナルからの実行でも動くようにする）
configurations {
    mockitoAgent
}

dependencies {
    mockitoAgent('org.mockito:mockito-core') {
        transitive = false
    }
}

tasks.withType(Test).configureEach {
    jvmArgumentProviders.add({ ["-javaagent:${configurations.mockitoAgent.singleFile}"] } as CommandLineArgumentProvider)
}
