# ═══════════════════════════════════════════════════════════
#  Udemy「Spring Boot Webアプリ応用（ECサイト）」の演習
#
#  講義そのものは動画側にあり、ここには講座のサンプル（learn_spring_aidd_practical の
#  projects/master）を Codinable 単独で動く形にしたものを置く
#  問題を出して解かせることはしない
#
#  サンプルは 3 つのアプリで、チャプターごとに同じアプリを別の観点で読む
#    leaf-books-mvc  Spring Web（MVC）+ Thymeleaf の書店（ポート 8080）
#    leaf-books      REST API + React の書店（API 8080 / Vite 5173）
#    customer-hub    書店が呼ぶ外部 API（ポート 8081）
#  同じアプリを使う演習は dir で同じ雛形を指す（作業用プロジェクトは演習ごとに別に作られる）
#  書店の雛形には customer-hub/（と frontend/）を同梱している。どちらも codinable.services.json の
#  processes に書いてあり、▶ アプリ実行で書店と一緒に起動する
#  DB は HSQLDB サーバーではなくインメモリで、起動のたびに sql/hsqldb/ から作り直す
#
#  exercises[] の項目:
#    id           演習の識別子（dir 省略時はディレクトリ名として使う）
#    dir          templates/ 配下のディレクトリ名（省略時は id）
#    chapter      対応するチャプター番号。一覧のバッジに出る
#    lesson       対応するレッスン番号と名前。一覧の副題に出る
#    runtime      実行環境（java / spring / node / react / python / static / sql / shell）
#    run          ▶ アプリ実行で動かすもの（gradle:bootRun）。テストが主役の演習は gradle:test にする
#                 （テストはテストクラスを開いてエディタの右上の ▶ 実行で流す。gradle:test はツリーでテストクラスを目立たせる）
#    suggestName  作業用プロジェクト名の既定値
#    names        演習名（言語ごと）
#    descriptions 「何をどう動かすか」の説明（言語ごと）
#    preview      サーバーの URL を検知したとき、プレビューで最初に開くパス（/ に画面が無いとき）
#    openFiles    演習を開いた直後に開くファイル。演習の概要の README.md 1 つ（DB・SQL の演習はテーブル構成も README.md に書く）
# ═══════════════════════════════════════════════════════════
id: spring-boot-webapp-practical
order: 7
# 同じ id の講座が複数の置き場にあるときは、この version が新しいほうが使われる
version: 1.3.2

names:
  ja: Spring Boot Webアプリ応用（ECサイト）
  en: 'Spring Boot Web Apps: Advanced (E-commerce Site)'

descriptions:
  ja: >-
    書籍の検索・カート・ログイン・注文・在庫更新を持つ書店アプリを、
    サーバサイドMVC版と React（SPA）+ REST API 版の両方から読み解く講座の演習です。
    外部システム役の Customer Hub も含みます。
    講座本編は HSQLDB サーバーを使いますが、ここではインメモリの HSQLDB で動くように調整してあります。
  en: >-
    Exercises for the course that reads a bookstore app - search, cart, login, orders and
    stock updates - both as a server-side MVC app (Spring Web) and as a React SPA with a REST API,
    together with Customer Hub, the external API it calls.
    The course itself uses an HSQLDB server; these are adjusted to run on in-memory HSQLDB.

udemy:
  url: https://github.com/KenyaSaitoh/learn_spring_aidd_practical

# チャプター名（演習一覧の見出し。講座原稿の目次と同じ名前にする）
chapters:
  2:
    ja: '全体のコンポーネント構成'
    en: 'Overall Component Structure'
  3:
    ja: 'DBアクセス・外部システム連携（API）'
    en: 'Database Access and External System Integration (API)'
  4:
    ja: 'Spring WebによるサーバサイドMVC'
    en: 'Server-Side MVC with Spring Web'
  5:
    ja: 'React（SPA）とSpring WebによるREST API連携'
    en: 'React (SPA) and REST API Integration with Spring Web'
  6:
    ja: 'Spring SecurityとJWTによる認証・認可'
    en: 'Authentication and Authorization with Spring Security and JWT'

exercises:
  # ── チャプター2: 全体のコンポーネント構成 ─────────────────
  - id: leaf-books-api-layers
    dir: leaf-books
    chapter: 2
    lesson: '2.1 全体のコンポーネント構成'
    runtime: spring
    run: 'gradle:bootRun'
    suggestName: leaf-books-api-layers
    names:
      ja: SPA版のバックエンドをレイヤで読む
      en: Read the SPA backend layer by layer
    descriptions:
      ja: >-
        REST API 版の書店です。api / service / repository / entity / external の
        パッケージが、HTTP 入出力・業務処理・DB・外部システム連携（API）のどれを受け持つかを対応付けて読みます。
        ▶ アプリ実行で API が 8080 で、呼び出し先の Customer Hub が 8081 で起動します。
        React の画面（5173）も一緒に起動します。ログインして JSON を確かめる手順は README.md にあります。
      en: >-
        The REST API version of the bookstore. Map the api / service / repository / entity /
        external packages to what each handles: HTTP I/O, business logic, the DB and the
        external API. ▶ Run app starts the API on port 8080 and Customer Hub, the API it calls, on 8081.
        The React screen (5173) starts as well. README.md shows how to log in and check the JSON.
    openFiles:
      - README.md

  - id: leaf-books-mvc-layers
    dir: leaf-books-mvc
    chapter: 2
    lesson: '2.1 全体のコンポーネント構成'
    runtime: spring
    run: 'gradle:bootRun'
    suggestName: leaf-books-mvc-layers
    names:
      ja: サーバサイドMVC版のServiceとDTOを読む
      en: Read the Service and DTOs of the MVC version
    descriptions:
      ja: >-
        サーバサイドMVC版の書店です。OrderService.orderBooks（Transaction Script）、注文の入力を運ぶ OrderTO、
        送料を決める DeliveryFeeService を読みます。▶ アプリ実行で書店が 8080 で、
        ログインに使う Customer Hub が 8081 で起動します。
        alice@example.com / password でログインし、カートから注文すると送料と注文履歴が確かめられます。
      en: >-
        The MVC version of the bookstore. Read OrderService.orderBooks (a Transaction Script),
        OrderTO which carries the order input, and DeliveryFeeService which decides the delivery fee.
        ▶ Run app starts the bookstore on port 8080 and Customer Hub, used for login, on 8081.
        Log in as alice@example.com / password and order from the
        cart to see the delivery fee and the order history.
    openFiles:
      - README.md

  # ── チャプター3: DBアクセス・外部システム連携（API） ─────
  - id: leaf-books-mvc-jpa
    dir: leaf-books-mvc
    chapter: 3
    lesson: '3.1 DBアクセス・外部システム連携（API）'
    runtime: spring
    run: 'gradle:test'
    suggestName: leaf-books-mvc-jpa
    names:
      ja: JPAの関連・検索・楽観的ロックを動かす
      en: Run JPA associations, queries and optimistic locking
    descriptions:
      ja: >-
        複合主キーの OrderDetail、JPQL と Criteria の検索（BookRepository / BookService）、
        version を条件にした在庫の更新（StockRepository）と、それを呼ぶ OrderService の
        トランザクション境界を読みます。StockRepositoryTest.java を開いて、エディタの右上の ▶ 実行で流してください。
        「バージョンが一致しない場合、更新が失敗すること」などの結果がテスト結果タブに出ます。
      en: >-
        Read OrderDetail with its composite key, JPQL and Criteria queries (BookRepository /
        BookService), the version-conditioned stock update (StockRepository) and the transaction
        boundary of OrderService that calls it. Open StockRepositoryTest.java and press ▶ Run at the top right
        of the editor; results such as the case where the update fails on a version mismatch appear in the test tab.
    openFiles:
      - README.md

  - id: customer-hub
    chapter: 3
    lesson: '3.1 DBアクセス・外部システム連携（API）'
    runtime: spring
    run: 'gradle:bootRun'
    preview: '/customers/1'
    suggestName: customer-hub
    names:
      ja: 外部システムのCustomer Hubを動かす
      en: Run Customer Hub, the external API
    descriptions:
      ja: >-
        書店から呼ばれる側（プロバイダ）の顧客 API です。▶ アプリ実行で 8081 で起動します。
        http://localhost:8081/customers/1 や
        /customers/query_email?email=alice@example.com で JSON を、
        存在しない ID で 404 を確かめます（curl/ のスクリプトを開いてエディタの右上の ▶ 実行でも送れます）。CustomerApi が CustomerService を呼び、
        業務例外を HTTP ステータスへ変換する流れを読みます。
      en: >-
        The customer API on the provider side, called by the bookstores. ▶ Run app starts it on port 8081.
        Check the JSON at http://localhost:8081/customers/1 and
        /customers/query_email?email=alice@example.com, and a 404 for an ID that does not exist (the scripts
        in curl/ send the same requests with ▶ Run at the top right of the editor).
        Read how CustomerApi calls CustomerService and turns business exceptions into HTTP statuses.
    openFiles:
      - README.md

  - id: leaf-books-mvc-external
    dir: leaf-books-mvc
    chapter: 3
    lesson: '3.1 DBアクセス・外部システム連携（API）'
    runtime: spring
    run: 'gradle:bootRun'
    suggestName: leaf-books-mvc-external
    names:
      ja: 外部システム連携（API）と入力検証を試す
      en: Try the external API call and input validation
    descriptions:
      ja: >-
        書店から Customer Hub を呼ぶ CustomerApiClient（RestTemplate・404 の例外変換）と、
        顧客登録フォームの Bean Validation（CustomerParam）を読みます。
        ▶ アプリ実行を押すと書店と Customer Hub が一緒に起動します。
        存在しないメールアドレスでのログイン、既存メールアドレスでの顧客登録、
        Customer Hub を止めた状態（出力タブの行の右端の「customer-hub停止」）でのログインで、画面の応答がどう変わるかを確かめます。
      en: >-
        Read CustomerApiClient, which calls Customer Hub from the bookstore (RestTemplate, mapping
        a 404 to an exception), and Bean Validation on the registration form (CustomerParam).
        ▶ Run app starts the bookstore together with Customer Hub. Compare the responses when logging in
        with an unknown email, registering an existing email, and logging in while Customer Hub is
        stopped (Stop customer-hub at the right end of the output tab row).
    openFiles:
      - README.md

  # ── チャプター4: Spring Web によるサーバサイドMVC ──
  - id: leaf-books-mvc-web
    dir: leaf-books-mvc
    chapter: 4
    lesson: '4.1 Spring WebによるサーバサイドMVC'
    runtime: spring
    run: 'gradle:bootRun'
    suggestName: leaf-books-mvc-web
    names:
      ja: サーバサイドMVC版の画面遷移・セッション・PRGを動かす
      en: Run screen flow, sessions and PRG in the MVC version
    descriptions:
      ja: >-
        Controller が Model とビュー名を返して Thymeleaf が HTML を作る流れ、
        @SessionAttributes のカート、TokenProcessor による SecurityContext の保存、
        注文後の Post/Redirect/Get を読みます。▶ アプリ実行で書店と Customer Hub が起動したら、
        alice@example.com / password でログイン → 書籍選択 → カート → 注文 → 注文履歴と進めます。
        注文完了画面で再読み込みしても注文が二重にならないことも確かめられます。
      en: >-
        Read how a Controller returns a Model and a view name for Thymeleaf to render,
        the cart kept with @SessionAttributes, how TokenProcessor stores the SecurityContext,
        and Post/Redirect/Get after an order. Once ▶ Run app has started the bookstore and Customer Hub,
        log in as
        alice@example.com / password and go through book selection, cart, order and order history.
        Reloading the order-complete page does not place the order twice.
    openFiles:
      - README.md

  # ── チャプター5: React（SPA）と Spring Web による REST API 連携 ─────
  - id: leaf-books-spa
    dir: leaf-books
    chapter: 5
    lesson: '5.1 React（SPA）とSpring WebによるREST API連携'
    runtime: react
    run: 'gradle:bootRun'
    suggestName: leaf-books-spa
    names:
      ja: React（SPA）で状態の移り変わりを追う
      en: Follow state changes in the React SPA
    descriptions:
      ja: >-
        React の画面構成（App.tsx の Router と Provider）、CartContext のカート state、
        OrderConfirmPage の送信中・成功・失敗の状態遷移を読みます。
        ▶ アプリ実行で REST API（8080）と Customer Hub（8081）、frontend/ の React の画面（5173）が一緒に起動し、
        画面が待ち受けを始めるとプレビューが http://localhost:5173 に移ります（初回は npm install が自動で走ります）。
        alice@example.com / password でログインして注文まで進めます。
      en: >-
        Read the React screen structure (Router and Providers in App.tsx), the cart state in
        CartContext, and the submitting / success / failure transitions in OrderConfirmPage.
        ▶ Run app starts the REST API (8080), Customer Hub (8081) and the React screen in frontend/ (5173) together;
        once the screen is listening, the preview moves to http://localhost:5173 (the first run installs the npm packages automatically).
        Log in as alice@example.com / password and go through to an order.
    openFiles:
      - README.md

  # ── チャプター6: Spring Security と JWT による認証・認可 ─────
  #    サーバサイドMVCのログイン（TokenProcessor）は、チャプター4の leaf-books-mvc-web で読む
  - id: leaf-books-api-jwt
    dir: leaf-books
    chapter: 6
    lesson: '6.1 Spring SecurityとJWTによる認証・認可'
    runtime: spring
    run: 'gradle:bootRun'
    suggestName: leaf-books-api-jwt
    names:
      ja: JWTによる認証・認可とエラー応答を確かめる
      en: Check JWT authentication and error responses in the REST API
    descriptions:
      ja: >-
        AuthController のログインと JWT の Cookie 発行、JwtAuthenticationFilter による検証、
        OrderController の入出力 DTO と GlobalExceptionHandler のエラー応答を読みます。
        ▶ アプリ実行で API（8080）と Customer Hub（8081）が起動したら、
        起動したまま curl/ のスクリプトを順に開いてエディタの右上の ▶ 実行で送り、
        ログイン前の 403、ログイン後の /api/books と /api/orders/history を確かめます。
        画面から確かめるときは、一緒に起動した React の画面（http://localhost:5173）をプレビューで操作します。
      en: >-
        Read login and JWT cookie issuance in AuthController, verification in
        JwtAuthenticationFilter, the request / response DTOs of OrderController and the error
        responses from GlobalExceptionHandler. Once ▶ Run app has started the API (8080) and Customer Hub
        (8081), keep them running, open the scripts in curl/ in order and press ▶ Run at the top right
        of the editor to see the 403 before login and /api/books and /api/orders/history after it. To check through the UI,
        use the React screen (http://localhost:5173) that starts together, in the preview.
    openFiles:
      - README.md
