# ═══════════════════════════════════════════════════════════
#  Udemy「Java Basic」の演習
#
#  講座の旧サンプル learn_java_basic_vsc（Eclipse 形式の素の Java）の 19 プロジェクトを、
#  それぞれ単独で動く Gradle プロジェクトにして templates/ に置いている。
#  フォルダー名は原稿の出典行（03_var_type_literal: Main_3_1）と同じ。
#
#  演習はレッスン（X.Y.Z）ごとに 1 つ。同じ雛形を別 id で使う。
#  チャプター番号は原稿と同じ X.Y（「チャプター3.1」）にしている。
#  run は gradle:run -PmainClass=… で、▶ アプリ実行がそのレッスンの main を動かす
#  （ほかの main は .java を開いてエディタの右上の ▶ 実行）。
#  標準入力を読むサンプル（06_statement の Main_If_1 など）は原稿がその前提で書いているのでそのまま。
#  ▶ アプリ実行は標準入力の要らない main に当てている。
# ═══════════════════════════════════════════════════════════
id: java-basic
order: 21
# 同じ id の講座が複数の置き場にあるときは、この version が新しいほうが使われる
version: 1.0.0

names:
  ja: Java Basic
  en: Java Basic

descriptions:
  ja: >-
    AI がコードを書く前提で、Java の文法とクラスの仕組みを読んで判断できるようにする講座の演習です。
    型とメモリー、演算子、配列、制御構文から、クラス、継承、インタフェース、列挙型、文字列、コレクション、例外、日時までを、
    原稿の出典行と同じ名前のフォルダーとクラスで動かして確かめます。
    ▶ アプリ実行でレッスンの main が動きます。ほかの main は .java を開いてエディタの右上の ▶ 実行で動かします。
  en: >-
    Exercises for the course that teaches you to read and judge Java code on the assumption that AI writes it:
    types and memory, operators, arrays and control flow, then classes, inheritance, interfaces, enums, strings,
    collections, exceptions and dates. Folders and classes have the same names as the source lines in the course text.
    ▶ Run app runs the main of the lesson. To run another main, open the .java file and press ▶ Run at the top right of the editor.

udemy:
  url: https://github.com/KenyaSaitoh/learn_java_basic_vsc

