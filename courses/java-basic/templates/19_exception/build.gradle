// ═══════════════════════════════════════════════════════════
//  19_exception
//  Udemy「Java Basic」の演習（Eclipse 形式の素の Java を、単独で動く Gradle プロジェクトにしたもの）
//    - ▶ アプリ実行 は演習ごとの main を動かす（course.yaml の run）
//    - .java を開いてエディタの右上の ▶ 実行 で、その main だけを動かせる（run -PmainClass=完全修飾クラス名）
// ═══════════════════════════════════════════════════════════

plugins {
    id 'java'
    id 'application'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

application {
    mainClass = 'pro.kensait.java.basic.lsn_19_1_4.case_3.Main'
}

tasks.named('run', JavaExec) {
    // 例外で終わる main は教材の一部なので、Gradle の失敗表示を重ねずスタックトレースだけを見せる
    ignoreExitValue = true
    // -PmainClass=完全修飾クラス名 を付けたときは、その main だけを動かす
    if (project.hasProperty('mainClass')) {
        mainClass = project.property('mainClass')
    }
}

// ── キーボードの入力の代わり ──────────────────────────
//  stdin/<完全修飾クラス名>.txt があれば、その main を動かすときに 1 行ずつ標準入力へ渡す
sourceSets { stdinSupport { java.srcDir 'stdin/support' } }

tasks.named('run', JavaExec) {
    def target = mainClass.get()
    def input = file("stdin/${target}.txt")
    if (input.exists()) {
        classpath += sourceSets.stdinSupport.output
        mainClass = 'StdinRunner'
        args target
        systemProperty 'stdin.file', input.absolutePath
    }
}
