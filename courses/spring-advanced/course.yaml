# ═══════════════════════════════════════════════════════════
#  Udemy「Spring FW 高度な仕組み」の演習
#
#  講義そのものは動画側にあるため、ここには講座リポジトリ（learn_spring_aidd_advanced）の
#  projects/master のサンプルを「開いてすぐ動く」形にしたものだけを置く
#  問題を出して解かせることはしない
#
#  サンプルはどれも単独で動く Gradle プロジェクトに直してある（親 build.gradle の共通設定を畳み込み）
#  2 つ以上のプロセスが要るもの（API とクライアント、プロデューサーとコンシューマー、
#  バックエンドと React 画面）は、ルート = ▶ アプリ実行で動かす側、サブフォルダ = もう片方
#  （api/ client/ consumer/ は独立した Gradle プロジェクト、frontend/ は npm パッケージ）にしている
#  待ち受けるもの（api/ consumer/ frontend/）は codinable.services.json の processes で ▶ アプリ実行と一緒に起動し、
#  起動して終わるクライアント（client/）は client/run.sh をエディタの右上の ▶ 実行で動かす
#
#  exercises[] の項目:
#    id           演習の識別子（dir 省略時はディレクトリ名として使う）
#    dir          templates/ 配下のディレクトリ名（省略時は id）
#    chapter      対応するチャプター番号。一覧のバッジに出る
#    lesson       対応するレッスン番号と名前。一覧の副題に出る
#    runtime      実行環境（java / spring / node / react / python / static / sql / shell）
#    run          ▶ アプリ実行で動かすもの（gradle:test ならテストクラスがツリーで目立つ。テストクラスは
#                 開いてエディタの右上の ▶ 実行で流す）
#                 ファイル単位で動かす演習では最初に動かすファイル（sql: / file:。エディタの右上の ▶ 実行で動かす）
#    suggestName  作業用プロジェクト名の既定値
#    names        演習名（言語ごと）
#    descriptions 「何をどう動かすか」の説明（言語ごと）
#    preview      サーバーの URL を検知したとき、プレビューで最初に開くパス（/ に画面が無いとき）
#    openFiles    演習を開いた直後に開くファイル。演習の概要の README.md 1 つ（DB・SQL の演習はテーブル構成も README.md に書く）
#
#  チャプター 1（コース概要）と 2（構成・設定・互換性の総論。特定のサンプルを動かさない）には
#  演習を付けていない
# ═══════════════════════════════════════════════════════════
id: spring-advanced
order: 3
# 同じ id の講座が複数の置き場にあるときは、この version が新しいほうが使われる
version: 1.8.4

names:
  ja: Spring FW 高度な仕組み
  en: 'Spring: Advanced Mechanisms'

descriptions:
  ja: >-
    社員管理システムを題材に、WebClient と WebSocket、Spring Security、JWT のリソースサーバー、
    GraphQL、WebFlux、@Async とコミット後のイベント、Kafka と RabbitMQ、リトライとサーキットブレーカー、
    Actuator と OpenTelemetry までを扱う講座の演習です。サンプルは Java 25 / Spring Boot 4.1 で動き、
    DB は HSQLDB のインメモリ、Kafka と RabbitMQ は Codinable 同梱のものを使います。
  en: >-
    Exercises for the course that builds on an employee management system: WebClient and
    WebSocket, Spring Security, a JWT resource server, GraphQL, WebFlux, @Async and after-commit
    events, Kafka and RabbitMQ, retry and circuit breakers, Actuator and OpenTelemetry. The samples run on Java 25 /
    Spring Boot 4.1 with an in-memory HSQLDB, and use the Kafka and RabbitMQ bundled with
    Codinable.

udemy:
  url: https://github.com/KenyaSaitoh/learn_spring_aidd_advanced

# チャプター名（演習一覧の見出し。講座原稿の目次と同じ名前にする）
chapters:
  3:
    ja: 'HTTPクライアントとWebSocketによる通信'
    en: 'Communication with HTTP Clients and WebSocket'
  4:
    ja: 'Spring Securityの認証・認可とリクエスト保護'
    en: 'Authentication, Authorization and Request Protection with Spring Security'
  5:
    ja: 'OAuth 2・OIDC・JWTによる認証連携'
    en: 'Federated Authentication with OAuth 2, OIDC and JWT'
  6:
    ja: 'GraphQLのスキーマとデータ取得'
    en: 'GraphQL Schemas and Data Fetching'
  7:
    ja: 'リアクティブ処理と非同期イベント'
    en: 'Reactive Processing and Asynchronous Events'
  8:
    ja: 'Kafka・RabbitMQによる非同期メッセージング'
    en: 'Asynchronous Messaging with Kafka and RabbitMQ'
  9:
    ja: '耐障害性の向上とリトライ・サーキットブレーカー'
    en: 'Handling Failures with Retries and Circuit Breakers'
  10:
    ja: '観測・監視機能'
    en: 'Observability and Monitoring in Spring'

exercises:
  # ── チャプター3: HTTPクライアントとWebSocket ──────────────
  - id: spring-webclient-employee
    chapter: 3
    lesson: '3.1 HTTPクライアントとWebSocketによる通信'
    runtime: spring
    run: 'gradle:bootRun'
    preview: '/employees'
    suggestName: spring-webclient-employee
    names:
      ja: WebClientで社員APIを呼び出す
      en: Call the employee API with WebClient
    descriptions:
      ja: >-
        ▶ アプリ実行で確認用の社員 API（8087）が起動します。起動したまま client/run.sh を開いて
        エディタの右上の ▶ 実行を押すと、WebClient の Java コンソールが
        取得・検索、Mono.zip と flatMap による要求の合成、登録・更新・削除と削除後の 404、
        @HttpExchange の HTTP インタフェースでの呼び出しを順に表示して終了します。
        API のテストは EmployeeApiTest.java を開いて、エディタの右上の ▶ 実行で流してください（クライアントも含めて確かめます）。
      en: >-
        ▶ Run app starts the employee API used for checking (port 8087). Keep it running, open
        client/run.sh and press ▶ Run at the top right of the editor: the WebClient console prints
        get, search, requests combined with Mono.zip and flatMap, create, update, delete and the 404
        after deletion, and calls through an @HttpExchange HTTP interface, then exits.
        For the API tests, which also drive the client, open EmployeeApiTest.java and press ▶ Run
        at the top right of the editor.
    openFiles:
      - README.md

  - id: spring-websocket-employee
    chapter: 3
    lesson: '3.1 HTTPクライアントとWebSocketによる通信'
    runtime: spring
    run: 'gradle:bootRun'
    suggestName: spring-websocket-employee
    names:
      ja: WebSocket／STOMPで社員通知を配信する
      en: Broadcast employee notices with WebSocket / STOMP
    descriptions:
      ja: >-
        ▶ アプリ実行で STOMP のバックエンド（8096）と React の画面（frontend/、5173）が一緒に起動し、
        プレビューに画面が開きます。同じ http://localhost:5173/ を外部ブラウザでも開いて 2 画面を接続し、
        一方の通知が両方に届くことを確かめます。
      en: >-
        ▶ Run app starts the STOMP backend (port 8096) together with the React screen (frontend/,
        port 5173), which opens in the preview. Open the same http://localhost:5173/ in an
        external browser as well, connect both, and watch a notice from one reach both.
    openFiles:
      - README.md

  # ── チャプター4: Spring Security ─────────────────────────
  - id: spring-sec-employee
    chapter: 4
    lesson: '4.1 Spring Securityの認証・認可とリクエスト保護'
    runtime: spring
    run: 'gradle:bootRun'
    suggestName: spring-sec-employee
    names:
      ja: フォーム認証・認可・CSRFを確かめる
      en: Try form login, authorization and CSRF
    descriptions:
      ja: >-
        ▶ アプリ実行でバックエンド（8083）と React の画面（5173）が一緒に起動し、プレビューに画面が開きます。
        Alice / 1111（閲覧）と Bob / 2222（CRUD）でログインし、401・403 と CSRF トークンの
        やり取りを画面と出力で確かめます。curl/02_session_cookie.sh を開いて ▶ 実行すると、
        セッションの Cookie の属性と、ログインでセッション ID が変わることを確かめられます。
      en: >-
        ▶ Run app starts the backend (port 8083) together with the React screen (port 5173), which
        opens in the preview. Sign in as
        Alice / 1111 (read-only) and Bob / 2222 (CRUD) and look at the 401 / 403 responses and
        the CSRF token exchange. Open curl/02_session_cookie.sh and press ▶ Run to see the session
        cookie attributes and the session ID changing at login.
    openFiles:
      - README.md

  # ── チャプター5: OAuth 2・OIDC・JWT ──────────────────────
  - id: spring-resource-server-employee
    chapter: 5
    lesson: '5.1 OAuth 2・OIDC・JWTによる認証連携'
    runtime: spring
    run: 'gradle:bootRun'
    preview: '/employees'
    suggestName: spring-resource-server-employee
    names:
      ja: JWTのリソースサーバーでREST APIを保護する
      en: Protect a REST API as a JWT resource server
    descriptions:
      ja: >-
        Bearer のアクセストークンを oauth2ResourceServer().jwt() で検証し、employee_roles クレームの権限で認可する社員 API（8097）です。
        トークンは同じアプリの中の教材用の発行者が、リソースに置いた鍵ペアで発行します。▶ アプリ実行のあと curl/ のスクリプトを
        ▶ 実行すると、トークンなし・権限不足・ID トークン・署名の改ざんがそれぞれ拒否されることを確かめられます。
        EmployeeApiSecurityTest.java を開いて ▶ 実行すると、別の鍵・別の発行者・期限切れの拒否も流れます。
      en: >-
        An employee API (port 8097) that verifies Bearer access tokens with oauth2ResourceServer().jwt() and authorizes by the
        employee_roles claim. A teaching token issuer inside the same app signs the tokens with a key pair kept in the resources.
        After ▶ Run app, run the scripts in curl/ with ▶ Run to see requests without a token, with too few roles, with an ID token
        and with a tampered signature rejected. Open EmployeeApiSecurityTest.java and press ▶ Run for tokens with another key,
        another issuer and an expired lifetime.
    openFiles:
      - README.md

  # ── チャプター6: GraphQL ─────────────────────────────────
  - id: spring-graphql-employee
    chapter: 6
    lesson: '6.1 GraphQLのスキーマとデータ取得'
    runtime: spring
    run: 'gradle:bootRun'
    preview: '/graphiql'
    suggestName: spring-graphql-employee
    names:
      ja: GraphQLで社員を問い合わせる
      en: Query employees with GraphQL
    descriptions:
      ja: >-
        ▶ アプリ実行で GraphQL のバックエンド（8088）がインメモリ DB で起動します。
        プレビューの URL 欄に http://localhost:8088/graphiql を入れて Query と Mutation を試し、
        部署から社員をたどるネスト取得や errors 配列を確かめます。同じ問い合わせは curl/ のスクリプトを
        順に開いてエディタの右上の ▶ 実行でも送れます。専用の React 画面（5173）も
        一緒に起動するので、プレビューの URL 欄に http://localhost:5173/ を入れると開けます。
      en: >-
        ▶ Run app starts the GraphQL backend (port 8088) on an in-memory database. Enter
        http://localhost:8088/graphiql in the preview URL box to try queries and mutations,
        nested department-to-employee fetching and the errors array. The same requests can be sent
        by opening the scripts in curl/ in order and pressing ▶ Run at the top right of the editor.
        The dedicated React
        screen (port 5173) starts together; enter http://localhost:5173/ in the preview URL box to open it.
    openFiles:
      - README.md

  # ── チャプター7: リアクティブ処理と非同期イベント ─────────────
  - id: spring-webflux-employee
    chapter: 7
    lesson: '7.1 リアクティブ処理と非同期イベント'
    runtime: spring
    run: 'gradle:bootRun'
    preview: '/employees'
    suggestName: spring-webflux-employee
    names:
      ja: WebFluxとSSEで社員を配信する
      en: Stream employees with WebFlux and SSE
    descriptions:
      ja: >-
        ▶ アプリ実行で WebFlux のバックエンド（8089、Netty）が起動します。起動したまま、curl/ のスクリプトを
        順に開いてエディタの右上の ▶ 実行で送ってください。最後の 07_stream.sh（curl -N）では 1 秒ごとに
        社員が届き、complete イベントで終わります。React の画面（5173）も一緒に起動してプレビューに開くので、
        配信の開始と停止を操作します。
      en: >-
        ▶ Run app starts the WebFlux backend (port 8089, Netty). Keep it running, then open the
        scripts in curl/ in order and press ▶ Run at the top right of the editor. The last one,
        07_stream.sh (curl -N), delivers one employee per second and ends with a complete event.
        The React screen (port 5173) starts together and opens in the preview, where you start and
        stop the stream.
    openFiles:
      - README.md

  - id: spring-async-event-employee
    chapter: 7
    lesson: '7.1 リアクティブ処理と非同期イベント'
    runtime: spring
    run: 'gradle:bootRun'
    preview: '/departments/summary'
    suggestName: spring-async-event-employee
    names:
      ja: '@Asyncとコミット後のイベントを動かす'
      en: Run @Async and after-commit events
    descriptions:
      ja: >-
        仮想スレッドのエグゼキューターによる部署ごとの並行集計、@Async のメソッド、@TransactionalEventListener(phase = AFTER_COMMIT) による
        異動の通知を読みます。▶ アプリ実行（8098、インメモリ DB）のあと curl/ のスクリプトを ▶ 実行すると、異動の通知が別の仮想スレッドで動くことと、
        ロールバックした異動では通知されないことを確かめられます。TransferEventTest.java を開いて ▶ 実行すると同じことをテストで確かめられます。
      en: >-
        Read the parallel per-department summary on a virtual-thread executor, an @Async method, and the transfer notification with
        @TransactionalEventListener(phase = AFTER_COMMIT). After ▶ Run app (port 8098, in-memory database), run the scripts in curl/ with
        ▶ Run to see the notification running on another virtual thread, and no notification for a transfer that rolled back.
        Open TransferEventTest.java and press ▶ Run to check the same in tests.
    openFiles:
      - README.md

  # ── チャプター8: Kafka・RabbitMQによる非同期メッセージング ─────
  - id: spring-kafka-employee
    chapter: 8
    lesson: '8.1 Kafka・RabbitMQによる非同期メッセージング'
    runtime: spring
    run: 'gradle:bootRun'
    suggestName: spring-kafka-employee
    names:
      ja: Kafkaで社員イベントを送受信する
      en: Send and receive employee events with Kafka
    descriptions:
      ja: >-
        ▶ アプリ実行で同梱の Kafka、プロデューサー（8091）、コンシューマー（consumer/、8092）が一緒に起動し、
        プレビューに受信履歴（http://localhost:8092/events）が開きます。起動したまま curl/01_send_event.sh を開き、
        エディタの右上の ▶ 実行で POST /events を送って 202 を確かめ、プレビューを再読み込みして実際に受信した履歴を確かめます。
      en: >-
        ▶ Run app starts the bundled Kafka, the producer (port 8091) and the consumer (consumer/,
        port 8092) together, and the preview opens the received history at
        http://localhost:8092/events. Keep it running, open curl/01_send_event.sh and press ▶ Run at
        the top right of the editor to send POST /events, check the 202, then reload the preview to
        see the events actually received.
    openFiles:
      - README.md

  - id: spring-amqp-employee
    chapter: 8
    lesson: '8.1 Kafka・RabbitMQによる非同期メッセージング'
    runtime: spring
    run: 'gradle:bootRun'
    suggestName: spring-amqp-employee
    names:
      ja: RabbitMQで社員イベントを送受信する
      en: Send and receive employee events with RabbitMQ
    descriptions:
      ja: >-
        ▶ アプリ実行で同梱の RabbitMQ、プロデューサー（8093）、コンシューマー（consumer/、8094）、
        React の画面（5173）が一緒に起動し、プレビューに画面が開きます。イベントを送信し、
        「受信履歴を取得」で受信を確かめます。エクスチェンジとキューは「メッセージング」タブの管理画面でも見られます。
      en: >-
        ▶ Run app starts the bundled RabbitMQ, the producer (port 8093), the consumer (consumer/,
        port 8094) and the React screen (port 5173) together, and the screen opens in the preview.
        Send an event and fetch the received history. The exchange and queue are also
        visible in the management UI from the Messaging tab.
    openFiles:
      - README.md

  # ── チャプター9: リトライとサーキットブレーカー ──────────────
  - id: spring-resilience-employee
    chapter: 9
    lesson: '9.1 耐障害性の向上とリトライ・サーキットブレーカー'
    runtime: spring
    run: 'gradle:bootRun'
    preview: '/resilience-demo'
    suggestName: spring-resilience-employee
    names:
      ja: サーキットブレーカーとレート制限を確かめる
      en: Watch a circuit breaker and a rate limiter
    descriptions:
      ja: >-
        ▶ アプリ実行で Resilience4j のアプリ（8082）、呼び出し先 API（api/、8095）、React の画面（5173）が
        一緒に起動し、プレビューに画面が開きます。/resilience-demo を呼んだあと、出力タブの行の右端の
        「api停止」で API を止めて呼び出しを重ねると /resilience-status が OPEN になり、
        「api起動」で戻して 10 秒後に CLOSED へ戻ります。
        /ratelimit-demo を続けて呼ぶと 4 回目から 429 になります。
        呼び出しは画面のほか、curl/ のスクリプトを順に開いてエディタの右上の ▶ 実行でも送れます。
      en: >-
        ▶ Run app starts the Resilience4j app (port 8082), the API it calls (api/, port 8095) and the
        React screen (port 5173) together, and the screen opens in the preview. Call
        /resilience-demo, then stop the API with Stop api at the right end of the output tab row
        and keep calling: /resilience-status turns OPEN, and returns to CLOSED 10 seconds after
        Start api brings it back.
        Calling /ratelimit-demo in a row gives 429 from the fourth call.
        Besides the screen, you can send these calls by opening the scripts in curl/ in order and
        pressing ▶ Run at the top right of the editor.
    openFiles:
      - README.md

  - id: spring-retry-employee
    chapter: 9
    lesson: '9.1 耐障害性の向上とリトライ・サーキットブレーカー'
    runtime: spring
    run: 'gradle:bootRun'
    preview: '/retry-demo'
    suggestName: spring-retry-employee
    names:
      ja: Spring Retryで通信失敗をリトライする
      en: Retry failed calls with Spring Retry
    descriptions:
      ja: >-
        ▶ アプリ実行で Spring Retry のアプリ（8081）、呼び出し先 API（api/、8095）、React の画面（5173）が
        一緒に起動し、プレビューに画面が開きます。/retry-demo を呼んだあと、出力タブの行の右端の
        「api停止」で API を止めてもう一度呼ぶと、
        出力に「試行 1〜3 回目」が 1 秒・2 秒の間隔で並び、代替応答（fallback: true）が返ります。
        呼び出しは画面のほか、curl/ のスクリプトを順に開いてエディタの右上の ▶ 実行でも送れます。
      en: >-
        ▶ Run app starts the Spring Retry app (port 8081), the API it calls (api/, port 8095) and the
        React screen (port 5173) together, and the screen opens in the preview. Call /retry-demo,
        then stop the API with Stop api at the right end of the output tab row and call again: the output
        shows attempts 1 to 3 spaced 1 and 2 seconds apart, then a fallback response
        (fallback: true) comes back. Besides the screen, you can send these calls by opening the
        scripts in curl/ in order and pressing ▶ Run at the top right of the editor.
    openFiles:
      - README.md

  # ── チャプター10: 観測・監視 ─────────────────────────────
  - id: spring-actuator-employee
    chapter: 10
    lesson: '10.1 観測・監視機能'
    runtime: spring
    run: 'gradle:bootRun'
    preview: '/actuator/health'
    suggestName: spring-actuator-employee
    names:
      ja: Actuatorで稼働状態とメトリクスを見る
      en: Inspect health and metrics with Actuator
    descriptions:
      ja: >-
        ▶ アプリ実行で社員 API（8080）がインメモリ DB で起動します。起動したまま、curl/ のスクリプトを順に開いて
        エディタの右上の ▶ 実行で送ってください（プレビューで開いてもかまいません）。
        /actuator/health（カスタムの database コンポーネント）、/actuator/health/liveness・readiness、/actuator/info、
        /actuator/metrics/employee.get.count を見て、/employees/10001 を呼ぶ前後でカウンターの
        変化を確かめます。/actuator/loggers でログレベルを再起動なしで変えられます。
      en: >-
        ▶ Run app starts the employee API (port 8080) on an in-memory database. Keep it running,
        then open the scripts in curl/ in order and press ▶ Run at the top right of the editor (or
        open the URLs in the preview). Look at /actuator/health (with the custom database component),
        /actuator/health/liveness and readiness,
        /actuator/info and /actuator/metrics/employee.get.count, and compare the counter before and
        after calling /employees/10001. /actuator/loggers changes the log level without a restart.
    openFiles:
      - README.md

  - id: spring-observability-employee
    chapter: 10
    lesson: '10.1 観測・監視機能'
    runtime: spring
    run: 'gradle:bootRun'
    preview: '/employees/10001'
    suggestName: spring-observability-employee
    names:
      ja: Observationでメトリクス・トレース・ログをつなぐ
      en: Tie metrics, traces and logs together with Observation
    descriptions:
      ja: >-
        ▶ アプリ実行で社員 API（8080）がインメモリ DB で起動します。起動したまま、curl/ のスクリプトを順に開いて
        エディタの右上の ▶ 実行で送ってください。/employees/10001 を呼ぶと、出力のログに
        [spring-observability-employee,traceId,spanId] が付き、/actuator/metrics/employee.get に
        タイマーが現れます。トレースは外部へ送らず、ログの traceId／spanId で確かめます。
      en: >-
        ▶ Run app starts the employee API (port 8080) on an in-memory database. Keep it running,
        then open the scripts in curl/ in order and press ▶ Run at the top right of the editor. Calling
        /employees/10001 adds [spring-observability-employee,traceId,spanId] to the log lines in the
        output and a timer appears at /actuator/metrics/employee.get. Traces are not exported;
        check them through the traceId / spanId in the log.
    openFiles:
      - README.md
