server:
  port: 8088

spring:
# Codinable では HSQLDB サーバーを使わずインメモリで動かす
# 実行ボタンでは --spring.profiles.active=demo を渡せないため、demo を既定のプロファイルにしている
# （application-demo.yml が下の datasource をインメモリ DB に置き換え、schema.sql / data.sql を流す）
# 講座と同じく HSQLDB サーバー（localhost:9001）に接続したいときは、この 2 行を消す
  profiles:
    default: demo

# Spring for GraphQL
  graphql:
# GraphiQL（ブラウザ上でクエリを対話的に試せる開発用ツール）を有効化する
# http://localhost:8088/graphiql で開ける
    graphiql:
      enabled: true

  datasource:
    # HSQLDB (Server mode) - 複数プロジェクトで共有
    url: jdbc:hsqldb:hsql://localhost:9001/testdb
    username: SA
    password:
    driver-class-name: org.hsqldb.jdbc.JDBCDriver

# Spring Data JPA
  jpa:
    # 発行される SQL を実行結果に出す（@BatchMapping と N+1 の違いを確かめるため）
    show-sql: true
    properties:
      hibernate:
# エンティティの @Table・@Column の名前を、変換せずにそのまま使う
        naming:
          physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

logging:
  level:
    root: INFO
    org.springframework: INFO
    pro.kensait.spring.employee: INFO
