// OAuth 2 リソースサーバーの演習。Keycloak や Docker は使わず、1 つのプロセスで完結する
// 検証に使う公開鍵と、教材用の発行者が署名に使う秘密鍵は src/main/resources/keys に置いてある

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

// Java 25 で動かす（Codinable 同梱の JDK 25 をそのまま使う）
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // BearerTokenAuthenticationFilter・JwtDecoder・JwtEncoder（Nimbus）を提供する
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "failed", "skipped"
        exceptionFormat "full"
    }
}
