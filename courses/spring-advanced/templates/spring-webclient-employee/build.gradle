// WebClient の確認用 API（rest-employee-webclient-api・8087）
// 講座リポジトリでは api/ と client/ が別々のサブプロジェクトになっている。Codinable では
// このルートが API（実行ボタンで bootRun）、client/ が Java コンソール（ターミナルで run）になる
// 品質ゲート用の Checkstyle / SpotBugs / PIT などは Codinable では使わないので入れていない

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

// Java 25 で動かす（Codinable 同梱の JDK 25 をそのまま使う）
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // 講座リポジトリでは testImplementation project(':master:rest-client-employee-webclient') で
    // コンソールクライアントを取り込み、実際の API との通信もテストしている
    // ここでは client/ のソースをテスト用のソースとして読み込み、同じテストを動かす
    // （クライアントが使う WebClient のため、テストのクラスパスにだけ WebFlux を足す）
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    test {
        java {
            srcDir 'client/src/main/java'
        }
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "failed", "skipped"
        exceptionFormat "full"
    }
}
