server:
  port: 8084
  servlet:
    session:
      cookie:
        name: GOOGLE_SESSION
        same-site: lax
frontend:
  url: ${FRONTEND_URL:http://localhost:5173}
spring:
  # Codinable の実行ボタンでは環境変数を渡せないため、プロジェクト直下の .env も読み込む
  # .env.example を .env にコピーして GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET を書く（.env が無ければ環境変数だけを見る）
  # .env は秘密の値を含むので、他人に渡したり Git に登録したりしない
  config:
    import: optional:file:.env[.properties]
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8084/login/oauth2/code/google}
