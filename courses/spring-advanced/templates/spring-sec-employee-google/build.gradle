// 講座リポジトリ（learn_spring_aidd_advanced）の親 build.gradle の共通設定と、
// このプロジェクトの依存関係を 1 ファイルにまとめたもの
// バージョン変数（springBootVer など）は外して Spring Boot の BOM に任せている
// 品質ゲート用の Checkstyle / SpotBugs / PIT などは Codinable では使わないので入れていない

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

// Java 25 で動かす（Codinable 同梱の JDK 25 をそのまま使う）
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Thymeleaf extras は Spring Boot の BOM で管理されないため、講座リポジトリと同じ版を直書きする
    implementation 'org.thymeleaf.extras:thymeleaf-extras-java8time:3.0.4.RELEASE'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6:3.1.2.RELEASE'
    // OAuth2 - Spring Bootに管理を任せる（バージョン指定なし）
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    compileOnly 'jakarta.platform:jakarta.jakartaee-api:10.0.0'
    // ソース中の @SuppressFBWarnings（SpotBugs の指摘を抑止する注釈）をコンパイルするためだけに使う
    // （講座リポジトリでは親 build.gradle が全プロジェクトに入れている。SpotBugs 自体は Codinable では動かさない）
    compileOnly 'com.github.spotbugs:spotbugs-annotations:4.8.3'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "failed", "skipped"
        exceptionFormat "full"
    }
}
