<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Codinable</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif;
      background: #181818;
      color: #e8e8e8;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #333;
      -webkit-user-select: none;
      user-select: none;
      /* 枠なしウィンドウなので、どこを掴んでも動かせるようにする */
      -webkit-app-region: drag;
      overflow: hidden;
    }
    .card { text-align: center; padding: 28px 36px; width: 100%; }
    .logo { line-height: 1; margin-bottom: 12px; }
    .logo img { width: 64px; height: 64px; border-radius: 14px; }
    h1 { font-size: 19px; font-weight: 600; letter-spacing: .3px; margin-bottom: 4px; }
    .tagline { font-size: 11.5px; color: #7d7d7d; margin-bottom: 26px; }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font-size: 13px;
      color: #b8b8b8;
      min-height: 20px;
    }
    .spinner {
      flex: none;
      width: 14px; height: 14px;
      border: 2px solid #3a3a3a;
      border-top-color: #3d7eff;
      border-radius: 50%;
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .bar {
      margin: 18px auto 0;
      width: 240px; height: 3px;
      background: #2b2b2b;
      border-radius: 2px;
      overflow: hidden;
    }
    /* 起動にかかる時間は読めないので、進捗ではなく動いていることだけを示す */
    .bar > i {
      display: block;
      height: 100%;
      width: 35%;
      background: #3d7eff;
      border-radius: 2px;
      animation: slide 1.2s ease-in-out infinite alternate;
    }
    @keyframes slide { from { margin-left: 0; } to { margin-left: 65%; } }
  </style>
</head>
